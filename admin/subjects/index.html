<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін панель - Предмети</title>
    <link rel="stylesheet" href="../shared.css">
    <style>
        .table-actions { display: flex; gap: 8px; }
        .table-actions .btn { padding: 6px 12px; font-size: 0.85rem; }
        .subject-description { max-width: 400px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #555; }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>

    <div class="main-content">
        <div class="header header-fixed">
            <h1>Предмети</h1>
            <button class="btn-add" onclick="openAddModal()">
                ➕ Додати предмет
            </button>
        </div>

        <div class="card">
            <div class="search-bar">
                <input type="text" class="search-input" id="searchInput" placeholder="🔍 Пошук предметів...">
            </div>

            <div id="tableContainer">
                </div>
        </div>
    </div>

    <div class="modal" id="subjectModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Додати предмет</h2>
                <button class="btn-close" onclick="hideModal('subjectModal')">&times;</button>
            </div>
            <form id="subjectForm">
                <div class="form-group">
                    <label for="subjectName">Назва предмету *</label>
                    <input type="text" id="subjectName" required placeholder="Наприклад: Вища математика">
                </div>
                <div class="form-group">
                    <label for="subjectDescription">Опис предмету</label>
                    <textarea id="subjectDescription" placeholder="Введіть опис предмету (необов'язково)" maxlength="500"></textarea>
                    <div class="char-count">
                        <span id="charCount">0</span> / 500 символів
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-cancel" onclick="hideModal('subjectModal')">Скасувати</button>
                    <button type="submit" class="btn btn-save">💾 Зберегти</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Видалення предмету</h2>
                <button class="btn-close" onclick="hideModal('deleteModal')">&times;</button>
            </div>
            <div class="delete-message">
                Ви впевнені, що хочете видалити предмет <span class="delete-subject-name" id="deleteSubjectName"></span>?
                <br><br>
                Ця дія незворотна і може вплинути на розклад занять!
            </div>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="hideModal('deleteModal')">Скасувати</button>
                <button class="btn btn-confirm" onclick="confirmDelete()">🗑️ Видалити</button>
            </div>
        </div>
    </div>

    <script src="/assets/js/api.js"></script>
    <script src="../common.js"></script>
    <script src="../sidebar.js"></script>
    <script src="subject.js"></script>
</body>
</html>
