<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін панель - Викладачі</title>
    <link rel="stylesheet" href="../shared.css">
    <link rel="stylesheet" href="teacher.css">
</head>
<body>
    <div id="sidebar-container"></div>

    <div class="main-content">
        <div class="header header-fixed">
            <h1>Викладачі</h1>
            <button class="btn-add" onclick="openAddModal()">
                ➕ Додати викладача
            </button>
        </div>

        <div class="card">
            <div class="search-bar">
                <input type="text" class="search-input" id="searchInput" placeholder="🔍 Пошук викладачів...">
            </div>

            <div id="tableContainer">
                <div class="loading">
                    <div style="font-size: 48px; margin-bottom: 20px;">⏳</div>
                    <div>Завантаження викладачів...</div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="teacherModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Додати викладача</h2>
                <button class="btn-close" onclick="hideModal('teacherModal')">&times;</button>
            </div>
            <form id="teacherForm">
                <div class="form-group">
                    <label for="teacherName">ПІБ викладача *</label>
                    <input type="text" id="teacherName" required placeholder="Наприклад: Іванов Іван Іванович">
                </div>

                <div class="subjects-section" id="subjectsSection">
                    <h3>📚 Предмети викладача</h3>
                    <div class="subject-list" id="teacherSubjects">
                        <div class="no-subjects">Предметів не додано</div>
                    </div>
                    
                    <div class="add-subject-section">
                        <select id="subjectSelect">
                            <option value="">-- Оберіть предмет --</option>
                        </select>
                        <button type="button" class="btn-add-subject" onclick="addSubjectToTeacher()">
                            ➕ Додати
                        </button>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-cancel" onclick="hideModal('teacherModal')">Скасувати</button>
                    <button type="submit" class="btn btn-save">💾 Зберегти</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Видалення викладача</h2>
                <button class="btn-close" onclick="hideModal('deleteModal')">&times;</button>
            </div>
            <div class="delete-message">
                Ви впевнені, що хочете видалити викладача <span class="delete-teacher-name" id="deleteTeacherName"></span>?
                <br><br>
                Ця дія незворотна і може вплинути на розклад занять!
            </div>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="hideModal('deleteModal')">Скасувати</button>
                <button class="btn btn-confirm" onclick="confirmDelete()">🗑️ Видалити</button>
            </div>
        </div>
    </div>

    <script src="/assets/js/api.js"></script>
    <script src="../common.js"></script>
    <script src="../sidebar.js"></script>
    <script src="teacher.js"></script>
</body>
</html>
