<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Розклад | UniScheduler</title>
    <script src="/assets/js/theme-boot.js?v=5f07e596"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/tokens.css?v=9b325578">
    <link rel="stylesheet" href="/assets/css/base.css?v=27556bf0">
    <link rel="stylesheet" href="/assets/css/components.css?v=5bbfd7ff">
    <link rel="stylesheet" href="/assets/css/shell.css?v=9cb403b4">
    <link rel="stylesheet" href="/assets/css/pages/schedule.css?v=14f8af0f">
</head>
<body>
    <div id="sidebar-container"></div>

    <main class="sh-main">
        <div class="sch-bar">
            <select id="semesterSelect" class="select sch-sem" aria-label="Семестр">
                <option value="">Завантаження…</option>
            </select>
            <div class="sch-week">
                <button id="prevWeek" type="button" class="icon-btn" aria-label="Попередній тиждень"></button>
                <div id="weekLabel" class="sch-week-label">Тиждень</div>
                <button id="nextWeek" type="button" class="icon-btn" aria-label="Наступний тиждень"></button>
            </div>
            <div class="sch-filter">
                <div class="seg" id="viewSeg" role="group" aria-label="Фільтр">
                    <button type="button" class="is-on" data-view="all">Усі</button>
                    <button type="button" data-view="group">Група</button>
                    <button type="button" data-view="teacher">Викладач</button>
                    <button type="button" data-view="room">Аудиторія</button>
                </div>
                <select id="viewValue" class="select sm sch-view-value" aria-label="Значення фільтра" hidden></select>
            </div>
        </div>

        <div class="danger sch-gen-confirm" id="genConfirm"></div>

        <div class="sch-layout" id="schLayout">
            <div class="sch-scroll">
                <div id="gridState" hidden></div>
                <div class="wk" id="scheduleGrid"></div>
            </div>

            <aside class="card sch-bin">
                <div class="card-head">
                    <div class="card-title">Нерозподілені</div>
                    <span class="badge" id="unscheduledCount">0</span>
                </div>
                <div id="unscheduledList" class="uq dropzone sch-bin-list"></div>
            </aside>
        </div>
    </main>

    <div class="busy" id="generationLoader" role="status">
        <div class="busy-box">
            <span class="spinner lg"></span>
            <h3>Генерація розкладу</h3>
            <p>Алгоритм шукає оптимальні варіанти.</p>
            <div id="generationLog" class="log">Ініціалізація…</div>
        </div>
    </div>

    <script src="/assets/js/api.js?v=55e24ce9"></script>
    <script src="/assets/js/ui.js?v=ec4d50f9"></script>
    <script src="/assets/js/icons.js?v=eb6ccbed"></script>
    <script src="/assets/js/shell.js?v=2ee56235"></script>
    <script src="/assets/js/checks.js?v=e31922cd"></script>
    <script src="schedule.js?v=ddb0482e"></script>
</body>
</html>
