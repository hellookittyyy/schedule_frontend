<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Чекліст тестування розкладу</title>
<!-- Робочий файл для ручного тестування. Список перевірок береться з docs/test-cases.md:
     після змін у ньому запусти  py scripts/build-test-checklist.py
     Відмітки й баги зберігаються в цьому браузері (localStorage) автоматично. -->
<style>
  :root {
    --bg: #f6f6f3; --card: #fff; --text: #1d1d1b; --muted: #6b6b66; --line: #e2e2dc;
    --ok: #2f7d4f; --ok-bg: #e3f2e8; --fail: #b3392f; --fail-bg: #fbe6e3;
    --skip: #8a6d1f; --skip-bg: #f7efd7; --accent: #2d5fa8; --code: #efefea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a; --card: #212226; --text: #ececea; --muted: #9a9a95; --line: #34353a;
      --ok: #6cc48f; --ok-bg: #1f3a2a; --fail: #f08a80; --fail-bg: #45231f;
      --skip: #e0c26a; --skip-bg: #3d331a; --accent: #7aa7ec; --code: #2c2d31;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
  code { background: var(--code); padding: 0 4px; border-radius: 4px; font-size: 13px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 5px 10px; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  input, select, textarea { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  textarea { width: 100%; resize: vertical; min-height: 54px; }

  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 12px 20px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  .top { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .run { display: flex; gap: 6px; align-items: center; color: var(--muted); }
  .run input { width: 240px; }
  .bar { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; display: flex; flex: 1; min-width: 200px; }
  .bar span { height: 100%; }
  .stats { display: flex; gap: 14px; font-size: 14px; flex-wrap: wrap; }
  .stats b { font-variant-numeric: tabular-nums; }
  .tabs { display: flex; gap: 4px; margin-top: 10px; }
  .tabs button { border-radius: 6px 6px 0 0; border-bottom: none; }
  .tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 14px 0; }
  .tools .sp { flex: 1; }

  details.sec { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; }
  details.sec > summary { padding: 12px 16px; cursor: pointer; font-weight: 600; display: flex; gap: 10px; align-items: center; }
  details.sec > summary .cnt { margin-left: auto; font-weight: 400; color: var(--muted); font-size: 13px; }
  .grp { padding: 0 16px 10px; }
  .grp h3 { font-size: 14px; margin: 10px 0 6px; color: var(--muted); }
  .item { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); align-items: start; }
  .item.ok { background: linear-gradient(90deg, var(--ok-bg), transparent 40%); }
  .item.fail { background: linear-gradient(90deg, var(--fail-bg), transparent 40%); }
  .item.skip { background: linear-gradient(90deg, var(--skip-bg), transparent 40%); }
  .id { font-weight: 600; font-size: 13px; padding-left: 4px; }
  .warn { color: var(--skip); font-size: 12px; display: block; font-weight: 400; }
  .exp { color: var(--muted); margin-top: 3px; }
  .exp::before { content: "Очікую: "; font-weight: 600; }
  .acts { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .acts button { padding: 4px 8px; font-size: 13px; }
  .acts .b-ok.on { background: var(--ok); border-color: var(--ok); color: #fff; }
  .acts .b-fail.on { background: var(--fail); border-color: var(--fail); color: #fff; }
  .acts .b-skip.on { background: var(--skip); border-color: var(--skip); color: #fff; }
  .note { grid-column: 2 / 4; }
  .note textarea { min-height: 36px; font-size: 14px; }
  .linked { grid-column: 2 / 4; font-size: 13px; color: var(--fail); }
  .linked a { color: var(--fail); }

  .bugs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .card h2 { font-size: 16px; margin: 0 0 10px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 3px; }
  .field input, .field select { width: 100%; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .bug { border-top: 1px solid var(--line); padding: 10px 0; }
  .bug:first-of-type { border-top: none; }
  .bug .hd { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .bug .hd b { font-size: 15px; }
  .tag { font-size: 12px; padding: 1px 7px; border-radius: 4px; background: var(--code); }
  .tag.open { background: var(--fail-bg); color: var(--fail); }
  .tag.fixed { background: var(--ok-bg); color: var(--ok); }
  .bug dl { display: grid; grid-template-columns: 130px 1fr; gap: 2px 10px; margin: 6px 0; font-size: 14px; }
  .bug dt { color: var(--muted); }
  .bug dd { margin: 0; white-space: pre-wrap; word-break: break-word; }
  .empty { color: var(--muted); padding: 10px 0; }
  .hide { display: none !important; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (max-width: 800px) { .bugs-grid { grid-template-columns: 1fr; } .item { grid-template-columns: 1fr; } .note, .linked { grid-column: 1; } .acts { justify-content: flex-start; } }
  @media print {
    header .tabs, .tools, .acts button:not(.on), #tab-bugs .card:first-child { display: none !important; }
    header { position: static; }
    details.sec { break-inside: avoid-page; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Чекліст тестування розкладу</h1>
    <div class="top">
      <div class="run"><span>Прогін:</span><input id="run-name" placeholder="напр. перевірка 24.11, гілка deepen-master-detail"></div>
      <div class="bar" id="bar" title="Зелене: ок, червоне: не ок, жовте: пропущено"></div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="tabs">
      <button class="on" data-tab="checks">Перевірки</button>
      <button data-tab="bugs">Баги <span id="bug-count"></span></button>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="tab-checks">
    <div class="tools">
      <input id="q" type="search" placeholder="Пошук: номер або текст" style="width:240px">
      <select id="flt">
        <option value="all">Показати все</option>
        <option value="todo">Ще не перевірені</option>
        <option value="fail">Тільки «Не ок»</option>
        <option value="skip">Тільки пропущені</option>
        <option value="noted">З коментарем</option>
      </select>
      <button id="open-all">Розгорнути все</button>
      <button id="close-all">Згорнути все</button>
      <span class="sp"></span>
      <button id="export">Зберегти копію (файл)</button>
      <button id="import">Відкрити копію</button>
      <button id="reset">Новий прогін</button>
      <button onclick="window.print()">Друк</button>
      <input type="file" id="import-file" accept=".json" class="hide">
    </div>
    <div id="sections"></div>
  </section>

  <section id="tab-bugs" class="hide">
    <div class="tools">
      <span class="sp"></span>
      <button id="copy-bugs">Скопіювати всі баги текстом</button>
    </div>
    <div class="bugs-grid">
      <div class="card">
        <h2 id="bug-form-title">Новий баг</h2>
        <form id="bug-form">
          <div class="row2">
            <div class="field"><label>Кейс (номер)</label><input name="caseId" placeholder="В-7"></div>
            <div class="field"><label>Наскільки серйозно</label>
              <select name="severity">
                <option>Заважає працювати</option>
                <option selected>Помітно, але можна обійти</option>
                <option>Дрібниця / вигляд</option>
              </select></div>
          </div>
          <div class="field"><label>Коротко: що не так</label><input name="title" required placeholder="Доступність викладача не зберігається після F5"></div>
          <div class="field"><label>Сторінка (адреса)</label><input name="page" placeholder="http://localhost:5500/admin/teachers/?id=2"></div>
          <div class="field"><label>Що робила (кроки)</label><textarea name="steps" placeholder="1. ...&#10;2. ..."></textarea></div>
          <div class="field"><label>Що очікувала</label><textarea name="expected"></textarea></div>
          <div class="field"><label>Що сталося насправді</label><textarea name="actual"></textarea></div>
          <div class="field"><label>Консоль (F12 → Console), якщо є червоні рядки</label><textarea name="console"></textarea></div>
          <div class="field"><label>Скриншот (назва файлу або посилання)</label><input name="screenshot"></div>
          <div class="row2">
            <div class="field"><label>Стан</label>
              <select name="status"><option value="open">Відкритий</option><option value="fixed">Виправлено</option><option value="wontfix">Не баг / не виправляємо</option></select></div>
            <div class="field"><label>&nbsp;</label>
              <div style="display:flex;gap:6px"><button class="primary" type="submit">Зберегти баг</button><button type="button" id="bug-cancel">Очистити</button></div></div>
          </div>
        </form>
      </div>
      <div class="card">
        <h2>Знайдені баги</h2>
        <div id="bug-list"></div>
      </div>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>

(function () {
  var KEY = 'schedule-test-checklist-v1';
  var state = load();
  var editingBug = null;
  var $ = function (s, r) { return (r || document).querySelector(s); };

  function load() {
    try { var s = JSON.parse(localStorage.getItem(KEY)); if (s && s.items) return s; } catch (e) {}
    return { run: '', items: {}, bugs: [], nextBug: 1 };
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function md(s) {
    return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1');
  }
  function toast(t) { var el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove('show'); }, 1800); }
  function allItems() {
    var out = [];
    DATA.sections.forEach(function (s) { s.groups.forEach(function (g) { g.items.forEach(function (it) { out.push(it); }); }); });
    return out;
  }
  function st(id) { return state.items[id] || {}; }
  function bugsFor(id) { return state.bugs.filter(function (b) { return b.caseId && b.caseId.trim() === id; }); }

  // ---------- Перевірки ----------
  function renderSections() {
    var open = {};
    document.querySelectorAll('details.sec').forEach(function (d) { open[d.dataset.id] = d.open; });
    var q = $('#q').value.trim().toLowerCase();
    var flt = $('#flt').value;
    var html = '';
    DATA.sections.forEach(function (s, si) {
      var body = '', shown = 0;
      s.groups.forEach(function (g) {
        var rows = '';
        g.items.forEach(function (it) {
          var x = st(it.id);
          if (q && (it.id + ' ' + it.do + ' ' + (it.expect || '')).toLowerCase().indexOf(q) < 0) return;
          if (flt === 'todo' && x.s) return;
          if ((flt === 'fail' || flt === 'skip') && x.s !== flt) return;
          if (flt === 'noted' && !x.note) return;
          shown++;
          var bugs = bugsFor(it.id);
          rows += '<div class="item ' + (x.s || '') + '" data-id="' + esc(it.id) + '">' +
            '<div class="id">' + esc(it.id) + (it.warn ? '<span class="warn" title="Змінює або видаляє дані: спершу копія бази">⚠️ дані</span>' : '') + '</div>' +
            '<div><div>' + md(it.do) + '</div>' + (it.expect ? '<div class="exp">' + md(it.expect) + '</div>' : '') + '</div>' +
            '<div class="acts">' +
              '<button class="b-ok' + (x.s === 'ok' ? ' on' : '') + '" data-s="ok">✓ Ок</button>' +
              '<button class="b-fail' + (x.s === 'fail' ? ' on' : '') + '" data-s="fail">✗ Не ок</button>' +
              '<button class="b-skip' + (x.s === 'skip' ? ' on' : '') + '" data-s="skip">Пропустити</button>' +
              '<button data-note title="Коментар">💬</button>' +
              (x.s === 'fail' ? '<button data-bug title="Записати баг з цього кейсу">+ Баг</button>' : '') +
            '</div>' +
            '<div class="note' + (x.note || x.noteOpen ? '' : ' hide') + '"><textarea placeholder="Коментар до перевірки">' + esc(x.note || '') + '</textarea></div>' +
            (bugs.length ? '<div class="linked">Баги: ' + bugs.map(function (b) { return '<a href="#" data-goto-bug="' + b.n + '">#' + b.n + ' ' + esc(b.title) + '</a>'; }).join(', ') + '</div>' : '') +
            '</div>';
        });
        if (rows) body += '<div class="grp">' + (g.title ? '<h3>' + md(g.title) + '</h3>' : '') + rows + '</div>';
      });
      if (!shown && (q || flt !== 'all')) return;
      var c = counts(s);
      var id = 's' + si;
      var isOpen = id in open ? open[id] : (q || flt !== 'all');
      html += '<details class="sec" data-id="' + id + '"' + (isOpen ? ' open' : '') + '><summary>' + md(s.title) +
        '<span class="cnt">' + c.done + ' з ' + c.total + (c.fail ? ' · <span style="color:var(--fail)">не ок: ' + c.fail + '</span>' : '') + '</span></summary>' +
        (body || '<div class="grp empty">Нічого не знайдено</div>') + '</details>';
    });
    $('#sections').innerHTML = html || '<div class="empty">Нічого не знайдено</div>';
  }
  function counts(sec) {
    var c = { total: 0, ok: 0, fail: 0, skip: 0, done: 0 };
    (sec ? [sec] : DATA.sections).forEach(function (s) { s.groups.forEach(function (g) { g.items.forEach(function (it) {
      c.total++; var v = st(it.id).s; if (v) { c[v]++; c.done++; }
    }); }); });
    return c;
  }
  function renderStats() {
    var c = counts();
    var pct = function (n) { return c.total ? (100 * n / c.total) : 0; };
    $('#bar').innerHTML = '<span style="width:' + pct(c.ok) + '%;background:var(--ok)"></span>' +
      '<span style="width:' + pct(c.fail) + '%;background:var(--fail)"></span>' +
      '<span style="width:' + pct(c.skip) + '%;background:var(--skip)"></span>';
    var open = state.bugs.filter(function (b) { return b.status === 'open'; }).length;
    $('#stats').innerHTML = '<span>Перевірено: <b>' + c.done + '</b> з <b>' + c.total + '</b></span>' +
      '<span style="color:var(--ok)">Ок: <b>' + c.ok + '</b></span>' +
      '<span style="color:var(--fail)">Не ок: <b>' + c.fail + '</b></span>' +
      '<span style="color:var(--skip)">Пропущено: <b>' + c.skip + '</b></span>' +
      '<span>Відкритих багів: <b>' + open + '</b></span>';
    $('#bug-count').textContent = state.bugs.length ? '(' + state.bugs.length + ')' : '';
  }
  function findItem(id) { return allItems().filter(function (i) { return i.id === id; })[0]; }

  $('#sections').addEventListener('click', function (e) {
    var row = e.target.closest('.item');
    if (!row) return;
    var id = row.dataset.id;
    var x = state.items[id] = state.items[id] || {};
    var b = e.target.closest('button[data-s]');
    var link = e.target.closest('[data-goto-bug]');
    if (link) { e.preventDefault(); switchTab('bugs'); var el = document.getElementById('bug-' + link.dataset.gotoBug); if (el) el.scrollIntoView({ block: 'center' }); return; }
    if (b) {
      x.s = x.s === b.dataset.s ? '' : b.dataset.s;
      if (x.s === 'fail') x.noteOpen = true;
      x.at = new Date().toISOString();
      save(); renderSections(); renderStats();
      if (x.s === 'fail') { var ta = document.querySelector('.item[data-id="' + CSS.escape(id) + '"] .note textarea'); if (ta) ta.focus(); }
      return;
    }
    if (e.target.closest('[data-note]')) {
      x.noteOpen = !x.noteOpen || !!x.note; save();
      var n = row.querySelector('.note'); n.classList.toggle('hide'); if (!n.classList.contains('hide')) n.querySelector('textarea').focus();
      return;
    }
    if (e.target.closest('[data-bug]')) {
      var it = findItem(id);
      fillBugForm({ caseId: id, title: '', steps: it.do, expected: it.expect || '', actual: x.note || '', status: 'open' });
      editingBug = null; $('#bug-form-title').textContent = 'Новий баг';
      switchTab('bugs'); $('#bug-form [name=title]').focus();
    }
  });
  $('#sections').addEventListener('input', function (e) {
    if (e.target.tagName !== 'TEXTAREA') return;
    var id = e.target.closest('.item').dataset.id;
    (state.items[id] = state.items[id] || {}).note = e.target.value;
    save();
  });
  $('#q').addEventListener('input', renderSections);
  $('#flt').addEventListener('change', renderSections);
  $('#open-all').onclick = function () { document.querySelectorAll('details.sec').forEach(function (d) { d.open = true; }); };
  $('#close-all').onclick = function () { document.querySelectorAll('details.sec').forEach(function (d) { d.open = false; }); };
  $('#run-name').value = state.run || '';
  $('#run-name').addEventListener('input', function (e) { state.run = e.target.value; save(); });

  // ---------- Баги ----------
  var FIELDS = ['caseId', 'severity', 'title', 'page', 'steps', 'expected', 'actual', 'console', 'screenshot', 'status'];
  var LABELS = { caseId: 'Кейс', severity: 'Серйозність', page: 'Сторінка', steps: 'Що робила', expected: 'Що очікувала', actual: 'Що сталося', console: 'Консоль', screenshot: 'Скриншот' };
  var STATUS = { open: 'Відкритий', fixed: 'Виправлено', wontfix: 'Не баг' };
  function fillBugForm(b) {
    var f = $('#bug-form');
    FIELDS.forEach(function (k) { if (k in b) f.elements[k].value = b[k] || ''; });
    if (!b.severity) f.elements.severity.selectedIndex = 1;
    if (!b.status) f.elements.status.value = 'open';
  }
  function clearBugForm() {
    $('#bug-form').reset(); editingBug = null; $('#bug-form-title').textContent = 'Новий баг';
  }
  $('#bug-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target, b = {};
    FIELDS.forEach(function (k) { b[k] = f.elements[k].value.trim(); });
    if (editingBug) {
      var old = state.bugs.filter(function (x) { return x.n === editingBug; })[0];
      Object.assign(old, b);
      toast('Баг #' + editingBug + ' оновлено');
    } else {
      b.n = state.nextBug++; b.created = new Date().toISOString();
      state.bugs.push(b);
      toast('Баг #' + b.n + ' записано');
    }
    save(); clearBugForm(); renderBugs(); renderStats(); renderSections();
  });
  $('#bug-cancel').onclick = clearBugForm;
  function renderBugs() {
    if (!state.bugs.length) { $('#bug-list').innerHTML = '<div class="empty">Поки жодного. Натисни «✗ Не ок» на перевірці, а потім «+ Баг», або заповни форму зліва.</div>'; return; }
    var order = { open: 0, wontfix: 1, fixed: 2 };
    var list = state.bugs.slice().sort(function (a, b) { return (order[a.status] - order[b.status]) || (b.n - a.n); });
    $('#bug-list').innerHTML = list.map(function (b) {
      var dl = ['caseId', 'severity', 'page', 'steps', 'expected', 'actual', 'console', 'screenshot'].filter(function (k) { return b[k]; })
        .map(function (k) { return '<dt>' + LABELS[k] + '</dt><dd>' + esc(b[k]) + '</dd>'; }).join('');
      return '<div class="bug" id="bug-' + b.n + '"><div class="hd"><b>#' + b.n + ' ' + esc(b.title) + '</b>' +
        '<span class="tag ' + b.status + '">' + STATUS[b.status] + '</span></div>' +
        '<dl>' + dl + '</dl>' +
        '<div class="acts" style="justify-content:flex-start"><button data-edit="' + b.n + '">Редагувати</button>' +
        (b.status !== 'fixed' ? '<button data-fixed="' + b.n + '">Виправлено</button>' : '<button data-reopen="' + b.n + '">Відкрити знову</button>') +
        '<button data-copy="' + b.n + '">Скопіювати</button><button data-del="' + b.n + '">Видалити</button></div></div>';
    }).join('');
  }
  function bugById(n) { return state.bugs.filter(function (b) { return b.n === +n; })[0]; }
  function bugText(b) {
    var t = '### Баг #' + b.n + ': ' + b.title + '\nСтан: ' + STATUS[b.status] + '\n';
    ['caseId', 'severity', 'page', 'steps', 'expected', 'actual', 'console', 'screenshot'].forEach(function (k) {
      if (b[k]) t += LABELS[k] + ': ' + (b[k].indexOf('\n') >= 0 ? '\n' + b[k] : b[k]) + '\n';
    });
    return t;
  }
  function copy(text, msg) {
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () { toast(msg); }, function () {
      var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast(msg);
    });
  }
  $('#bug-list').addEventListener('click', function (e) {
    var t = e.target, b;
    if (t.dataset.edit) { b = bugById(t.dataset.edit); fillBugForm(b); editingBug = b.n; $('#bug-form-title').textContent = 'Редагування бага #' + b.n; window.scrollTo(0, 0); }
    else if (t.dataset.fixed) { bugById(t.dataset.fixed).status = 'fixed'; save(); renderBugs(); renderStats(); }
    else if (t.dataset.reopen) { bugById(t.dataset.reopen).status = 'open'; save(); renderBugs(); renderStats(); }
    else if (t.dataset.copy) { copy(bugText(bugById(t.dataset.copy)), 'Скопійовано'); }
    else if (t.dataset.del) {
      if (!confirm('Видалити баг #' + t.dataset.del + '?')) return;
      state.bugs = state.bugs.filter(function (x) { return x.n !== +t.dataset.del; });
      save(); renderBugs(); renderStats(); renderSections();
    }
  });
  $('#copy-bugs').onclick = function () {
    if (!state.bugs.length) { toast('Багів поки немає'); return; }
    var head = '# Баги' + (state.run ? ' — ' + state.run : '') + '\n\n';
    copy(head + state.bugs.map(bugText).join('\n'), 'Усі баги скопійовано. Встав у чат або документ');
  };

  // ---------- Збереження / новий прогін ----------
  $('#export').onclick = function () {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'test-run-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click(); URL.revokeObjectURL(a.href);
  };
  $('#import').onclick = function () { $('#import-file').click(); };
  $('#import-file').onchange = function (e) {
    var f = e.target.files[0]; if (!f) return;
    f.text().then(function (txt) {
      var s = JSON.parse(txt);
      if (!s.items || !s.bugs) throw new Error();
      if (!confirm('Замінити поточні відмітки й баги вмістом файлу?')) return;
      state = s; save(); $('#run-name').value = state.run || ''; renderAll(); toast('Відкрито');
    }).catch(function () { alert('Це не файл копії чекліста.'); });
    e.target.value = '';
  };
  $('#reset').onclick = function () {
    if (!confirm('Почати новий прогін? Усі відмітки й коментарі зникнуть. Баги залишаться.\nПорада: спершу «Зберегти копію (файл)».')) return;
    state.items = {}; state.run = ''; $('#run-name').value = ''; save(); renderAll();
  };

  function switchTab(name) {
    document.querySelectorAll('.tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === name); });
    $('#tab-checks').classList.toggle('hide', name !== 'checks');
    $('#tab-bugs').classList.toggle('hide', name !== 'bugs');
  }
  document.querySelectorAll('.tabs button').forEach(function (b) { b.onclick = function () { switchTab(b.dataset.tab); }; });

  function renderAll() { renderSections(); renderStats(); renderBugs(); }
  renderAll();
})();
