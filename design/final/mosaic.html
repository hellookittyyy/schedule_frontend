<!DOCTYPE html>
<!-- Saved final candidate «Мозаїка» (2026-11-19). Self-contained snapshot: do not depend on design/ui-variants. -->
<html lang="uk" data-theme="light" data-palette="x-mosaic">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Розклад — Мозаїка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600&display=swap" rel="stylesheet">
<style>/* look.css */
/* =====================================================================
   Token-driven visual layer shared by the 5 UI variants.
   A variant = its own :root tokens + a few signature overrides.
   ===================================================================== */
:root{
  --font:system-ui,sans-serif; --font-head:var(--font); --font-num:var(--font);
  --bg:#f4f4f5; --surface:#fff; --surface-2:#f4f4f5; --line:#e4e4e7; --text:#18181b; --muted:#71717a; --faint:#a1a1aa;
  --accent:#18181b; --accent-ink:#fff; --accent-soft:#f4f4f5;
  --nav-bg:var(--surface); --nav-text:var(--muted); --nav-strong:var(--text); --nav-active-bg:var(--surface-2); --nav-active-text:var(--text); --nav-line:var(--line);
  --radius:12px; --radius-sm:8px; --btn-radius:8px; --pill:999px;
  --card-border:1px solid var(--line); --card-shadow:none; --pad:20px; --gap:16px; --page-pad:28px;
  --lec:#3b6fd8; --lec-soft:#e8effc; --pr:#1f8a5b; --pr-soft:#e3f4ec; --lab:#b7791f; --lab-soft:#fbf1df;
  --high:#d14343; --mid:#d98b1c; --low:#8b8b94; --ok:#1f8a5b;
  --hero-bg:var(--accent); --hero-text:var(--accent-ink); --hero-muted:rgba(255,255,255,.65); --hero-track:rgba(255,255,255,.2); --hero-bar:var(--accent-ink);
  --track:var(--surface-2); --bar:var(--accent);
  --heat0:var(--surface-2); --heat1:#d4d4d8; --heat2:#a1a1aa; --heat3:#52525b; --heat4:#18181b;
  --title-size:26px; --h2-size:15px; --title-weight:600; --h-transform:none; --h-spacing:-.01em;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.muted{color:var(--muted)}.sm{font-size:12px}.grow{flex:1;min-width:0}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.icon.xs{width:14px;height:14px}

/* nav */
.nav{background:var(--nav-bg);color:var(--nav-text);border-right:1px solid var(--nav-line);padding:20px 12px;gap:4px}
.nav-brand{display:flex;align-items:center;gap:10px;padding:0 10px 18px}
.brand-mark{width:30px;height:30px;border-radius:var(--radius-sm);background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-head);font-weight:700;font-size:15px}
.brand-name{font-family:var(--font-head);font-weight:700;font-size:16px;color:var(--nav-strong);letter-spacing:var(--h-spacing)}
.nav-group{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
.nav-label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:6px 10px}
.nav-item{padding:8px 10px;border-radius:var(--radius-sm);color:var(--nav-text);font-weight:500;transition:background .15s,color .15s}
.nav-item:hover{color:var(--nav-strong);background:var(--nav-active-bg)}
.nav-item.is-active{background:var(--nav-active-bg);color:var(--nav-active-text)}
.nav-count{font-size:12px;font-family:var(--font-num);color:var(--faint)}
.nav-user{display:flex;align-items:center;gap:10px;padding:12px 10px 0;margin-top:8px;border-top:1px solid var(--nav-line)}
.nav-user-name{font-weight:600;color:var(--nav-strong);font-size:13px}.nav-user-role{font-size:12px;color:var(--faint)}

/* main + topbar */
.main{padding:var(--page-pad)}
.topbar{margin-bottom:22px}
.crumbs{font-size:12px;color:var(--muted);margin-bottom:2px}
.page-title{margin:0;font-family:var(--font-head);font-size:var(--title-size);font-weight:var(--title-weight);letter-spacing:var(--h-spacing);display:flex;align-items:center;gap:10px}
.search{height:38px;padding:0 12px;border-radius:var(--btn-radius);background:var(--surface);border:var(--card-border);color:var(--muted);width:280px}
.search input::placeholder{color:var(--faint)}
kbd{font-family:var(--font-num);font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.icon-btn{width:38px;height:38px;border-radius:var(--btn-radius);background:var(--surface);border:var(--card-border);color:var(--muted);position:relative}
.icon-btn .dot{position:absolute;top:9px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--high);border:2px solid var(--surface)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--text);font-size:12px;font-weight:600}
.avatar.sm{width:26px;height:26px;font-size:11px}.avatar.lg{width:52px;height:52px;font-size:17px}

/* card */
.card{background:var(--surface);border:var(--card-border);border-radius:var(--radius);box-shadow:var(--card-shadow);padding:var(--pad)}
.card-head{margin-bottom:14px}
.card-title{margin:0;font-family:var(--font-head);font-size:var(--h2-size);font-weight:600;text-transform:var(--h-transform);letter-spacing:var(--h-spacing)}

/* buttons */
.btn{height:38px;padding:0 14px;border-radius:var(--btn-radius);border:1px solid var(--line);background:var(--surface);font-weight:500;transition:background .15s,border-color .15s,opacity .15s}
.btn:hover{border-color:var(--faint)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{opacity:.9;border-color:var(--accent)}
.btn-ghost{background:transparent}
.btn-sm{height:30px;padding:0 11px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* small elements */
.seg{background:var(--surface-2);border-radius:var(--btn-radius);padding:3px;gap:2px}
.seg button{background:none;padding:5px 11px;border-radius:calc(var(--btn-radius) - 2px);font-size:13px;color:var(--muted);font-weight:500}
.seg button.is-on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:var(--pill);font-size:12px;font-weight:500;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.badge-lec{background:var(--lec-soft);color:var(--lec)}.badge-pr{background:var(--pr-soft);color:var(--pr)}.badge-lab{background:var(--lab-soft);color:var(--lab)}
.badge-status{font-family:var(--font);font-size:12px;letter-spacing:0;text-transform:none;font-weight:500;background:var(--accent-soft);color:var(--text)}
.tag{font-size:11px;font-weight:600;border-radius:var(--pill);padding:2px 8px;background:var(--accent-soft);color:var(--text)}
.progress{height:6px;border-radius:var(--pill);background:var(--track)}.progress>i{background:var(--bar);border-radius:inherit}
.progress.sm{height:4px;margin:10px 0 6px}

/* home */
.home-top{margin-bottom:var(--gap)}
.hero{background:var(--hero-bg);color:var(--hero-text);border-color:transparent;display:flex;flex-direction:column;gap:10px}
.hero-label{font-size:13px;color:var(--hero-muted)}
.hero-row{display:flex;align-items:baseline;gap:12px}
.hero-value{font-family:var(--font-num);font-size:44px;font-weight:600;line-height:1;letter-spacing:-.03em}.hero-value small{font-size:22px;margin-left:2px}
.hero-note{font-size:13px;color:var(--hero-muted)}
.hero .progress{background:var(--hero-track)}.hero .progress>i{background:var(--hero-bar)}
.btn-hero{align-self:flex-start;margin-top:4px;background:transparent;color:var(--hero-text);border-color:var(--hero-track);height:32px;font-size:13px}
.kpi{display:flex;flex-direction:column}
.kpi-label{font-size:13px;color:var(--muted)}
.kpi-value{font-family:var(--font-num);font-size:30px;font-weight:600;letter-spacing:-.02em;margin-top:8px;line-height:1.1}.kpi-value small{font-size:15px;color:var(--faint);font-weight:500;margin-left:4px}
.kpi-note{font-size:12px;color:var(--muted);margin-top:auto;padding-top:8px}
.task-group+.task-group{margin-top:16px}
.task-group-label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-bottom:6px}
.task-group-label span{font-family:var(--font-num);color:var(--faint)}
.sev{width:7px;height:7px;border-radius:50%;display:inline-block}.sev-high{--c:var(--high)}.sev-mid{--c:var(--mid)}.sev-low{--c:var(--low)}.sev{background:var(--c)}
.task{padding:12px 0;border-top:1px solid var(--line)}
.sev-ico{width:30px;height:30px;border-radius:var(--radius-sm);display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.task-title{font-weight:500}.task-meta{font-size:12px;color:var(--muted)}
.task-fix{margin-top:4px;padding:12px;border-radius:var(--radius-sm);background:var(--surface-2)}
.fix-label{font-size:12px;color:var(--muted);margin-bottom:6px}
.fix-opt{padding:8px;border-radius:var(--radius-sm);border:1px solid transparent;font-size:13px}
.fix-opt input{accent-color:var(--accent);margin:0}
.fix-opt.is-sel{background:var(--surface);border-color:var(--line)}
.fix-actions{display:flex;gap:8px;margin-top:10px}
.today-row{padding:9px 0;border-top:1px solid var(--line)}.today-row:first-of-type{border-top:0}
.room{font-family:var(--font-num);font-weight:600;font-size:13px}
.today-row .t{font-weight:500}
.heat .hd{font-size:11px;color:var(--faint);text-align:center;align-self:center}
.heat i{border-radius:4px}.h0{background:var(--heat0)}.h1{background:var(--heat1)}.h2{background:var(--heat2)}.h3{background:var(--heat3)}.h4{background:var(--heat4)}
.legend{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--faint);margin-top:12px}.legend i{width:14px;height:10px;border-radius:3px}.legend span:first-child{margin-right:4px}.legend span:last-child{margin-left:4px}

/* directory */
.md{padding:0;overflow:hidden}
.md-list{border-right:1px solid var(--line);padding:14px 0 0}
.md-search{margin:0 14px;width:auto;background:var(--surface-2);border-color:transparent}
.md-filters{padding:12px 14px}
.chip{height:28px;padding:0 11px;border-radius:var(--pill);border:1px solid var(--line);font-size:12px;font-weight:500;color:var(--muted);background:var(--surface)}
.chip.is-on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip-add{border-style:dashed}.chip.link{color:var(--text)}
.md-row{padding:10px 14px;border-top:1px solid var(--line);transition:background .12s}
.md-row:hover{background:var(--surface-2)}
.md-row.is-active{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.md-row .name{font-weight:500;font-size:13px}.md-row .meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.md-row .num{font-size:12px;color:var(--muted)}.num.warn{color:var(--high)}
.md-detail{padding:24px 28px}
.detail-name{margin:0;font-family:var(--font-head);font-size:20px;font-weight:600;letter-spacing:var(--h-spacing)}
.saved{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ok)}
.section{margin-top:26px}
.section-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;display:flex;gap:10px;align-items:baseline}
.section-title .muted{text-transform:none;letter-spacing:0;font-weight:400}
.fields{border-top:1px solid var(--line)}
.f-label,.f-value{padding:11px 0;border-bottom:1px solid var(--line);min-height:44px;display:flex;align-items:center}
.f-label{color:var(--muted);font-size:13px}
.f-value.editable{border-radius:0}.f-value.editable:hover{background:var(--surface-2);cursor:text}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px}.status::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--ok)}.status.st-leave::before{background:var(--mid)}
.load{display:flex;align-items:center;gap:12px;width:100%;max-width:360px}.load .progress{flex:1}.load .num{font-size:13px;color:var(--muted)}
.avail{max-width:520px}.avail .hd{font-size:11px;color:var(--faint);text-align:center;align-self:center}.avail .tm{text-align:left}
.avail .c{border-radius:5px;background:var(--surface-2);border:1px solid var(--line);transition:background .12s}
.avail .c:hover{border-color:var(--faint)}
.avail .c.off{background:repeating-linear-gradient(135deg,var(--line) 0 3px,var(--surface) 3px 7px);border-color:var(--line)}

/* semester */
.steps{padding:0;overflow:hidden;margin-bottom:var(--gap)}
.step{padding:14px 16px;border-right:1px solid var(--line);position:relative}.step:last-child{border-right:0}
.step-n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;font-family:var(--font-num);border:1px solid var(--line);color:var(--muted);margin-bottom:6px}
.step-name{font-weight:600;font-size:13px}.step-meta{font-size:12px;color:var(--muted)}
.step.is-done .step-n{background:var(--ok);border-color:var(--ok);color:#fff}
.step.is-cur{background:var(--accent-soft)}.step.is-cur .step-n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step.is-cur::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent)}
.step.is-todo .step-name{color:var(--muted)}
.check{padding:11px 0;border-top:1px solid var(--line);font-size:13px}
.check-ico{width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.check.is-ok .check-ico{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.check.is-err .check-ico{background:color-mix(in srgb,var(--high) 14%,transparent);color:var(--high)}
.check.is-warn .check-ico{background:color-mix(in srgb,var(--mid) 16%,transparent);color:var(--mid)}
.check.is-ok>span:nth-child(2){color:var(--muted)}
.grp-row{padding:7px 0}.grp-row .g{font-family:var(--font-num);font-weight:600;font-size:13px}.grp-row .num{font-size:12px;color:var(--muted);text-align:right}.grp-row .num.ok{color:var(--ok)}
.empty{text-align:center;padding:22px 10px;color:var(--text);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px}
.empty-ico{width:40px;height:40px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);margin-bottom:6px}

/* public */
.pub-wrap{background:var(--bg);padding:24px 16px 90px}
.pub{display:flex;flex-direction:column;gap:14px}
.pub-head{padding-bottom:6px}.pub-head .brand-name{color:var(--text)}
.pub-search{width:100%;height:48px;font-size:15px;border-radius:var(--radius)}
.pub-search input{color:var(--text);font-weight:600}
.pub-title{margin-top:6px}.pub-title h1{margin:0;font-family:var(--font-head);font-size:32px;font-weight:var(--title-weight);letter-spacing:var(--h-spacing)}.pub-title .muted{font-size:13px}
.now-card{background:var(--hero-bg);color:var(--hero-text);border-color:transparent;display:flex;flex-direction:column;gap:10px}
.now-top{display:flex;justify-content:space-between;font-size:12px;color:var(--hero-muted)}
.now-label{display:inline-flex;align-items:center;gap:8px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.live{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:live 1.8s infinite}
@keyframes live{0%{box-shadow:0 0 0 0 rgba(255,255,255,.5)}70%{box-shadow:0 0 0 7px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.now-left{font-family:var(--font-num)}
.now-title{font-family:var(--font-head);font-size:22px;font-weight:600;line-height:1.2;letter-spacing:var(--h-spacing)}
.now-meta{font-size:13px;color:var(--hero-muted)}
.now-card .progress{background:var(--hero-track);height:4px}.now-card .progress>i{background:var(--hero-bar)}
.next-card{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px var(--pad)}
.next-label{font-size:12px;color:var(--muted);font-family:var(--font-num)}.next-title{font-weight:600;flex:1}
.daystrip{gap:6px}
.day{padding:8px 0;border-radius:var(--radius-sm);display:flex;flex-direction:column;gap:1px;background:var(--surface);border:var(--card-border)}
.dw{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.dn{font-family:var(--font-num);font-size:17px;font-weight:600}.dc{font-size:11px;color:var(--faint);height:14px}
.day.is-active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.day.is-active .dw,.day.is-active .dc{color:inherit;opacity:.7}
.day.is-today:not(.is-active) .dn{color:var(--accent)}
.lessons{padding:6px var(--pad)}
.lessons-head{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:10px 0 4px}
.lesson{padding:13px 0;border-top:1px solid var(--line)}
.l-time{display:flex;flex-direction:column;font-family:var(--font-num);font-size:12px;color:var(--muted)}.l-time b{font-size:14px;color:var(--text);font-weight:600}
.l-title{font-weight:600}.l-meta{font-size:12px;color:var(--muted)}
.lesson.is-past{opacity:.45}
.lesson.is-now .l-title::after{content:'зараз';margin-left:8px;font-size:11px;font-weight:600;color:var(--accent);vertical-align:1px}
.pub-foot{display:flex;justify-content:center}

/* ---------- Головна (точка входу) ---------- */
.welcome{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 24px;align-items:start;margin-bottom:var(--gap)}
.welcome.is-hidden{display:none}
.welcome-text p{margin:4px 0 0;font-size:13.5px}
.how{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0;padding:0;list-style:none}
.how li{display:flex;gap:12px;padding:14px 16px;border-radius:var(--radius-sm);background:var(--surface-2)}
.how li>b{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;flex:none}
.how li>span{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted);line-height:1.45}
.how li strong{color:var(--text);font-size:14px;font-weight:600}
.start-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:var(--gap);align-items:start}
.journey .steps{margin:2px 0 16px;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden}
.journey .step{padding:12px 14px}
.next{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 18px;border-radius:var(--radius-sm);background:var(--accent-soft)}
.next-k{font-size:12px;color:var(--muted)}
.next-t{font-weight:600;font-size:15px;margin:1px 0 2px}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qa{display:flex;align-items:flex-start;gap:12px;padding:14px;border:1px solid var(--line);border-radius:var(--radius-sm);background:none;cursor:pointer;text-align:left;transition:background .15s,border-color .15s}
.qa:hover{background:var(--surface-2);border-color:var(--faint)}
.qa-ico{width:36px;height:36px;border-radius:var(--radius-sm);display:grid;place-items:center;background:var(--surface-2);flex:none;color:var(--text)}
.qa b{display:block;font-size:14px;font-weight:600}
.qa b+span{display:block;font-size:12.5px;color:var(--muted);line-height:1.4;margin-top:2px}
.attention{display:flex;align-items:center;gap:12px}
.attention b{font-weight:600}
.today-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:10px}
.today-stats div{display:flex;flex-direction:column}
.today-stats b{font-size:26px;font-weight:600;line-height:1.1}
.today-stats span{font-size:12px;color:var(--muted)}
.change{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.change .when{font-family:var(--font-num);font-size:12px;color:var(--muted)}
@media (max-width:980px){.start-grid,.welcome{grid-template-columns:1fr}.how{grid-template-columns:1fr}.quick{grid-template-columns:1fr}.journey .steps{grid-template-columns:repeat(3,1fr)}}
.journey .step-meta{display:none}
.journey .step.is-cur .step-meta{display:block}

/* ---------- Головна: зведені блоки ---------- */
.res-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.res{padding:14px;border:1px solid var(--line);border-radius:var(--radius-sm);display:flex;flex-direction:column;gap:6px;min-width:0}
.res[data-to]{cursor:pointer}.res[data-to]:hover{background:var(--surface-2)}
.res-top{display:flex;align-items:center;gap:10px}
.res-ico{width:30px;height:30px;border-radius:var(--radius-sm);display:grid;place-items:center;background:var(--surface-2);flex:none}
.res-ico .icon{width:16px;height:16px}
.res-name{font-weight:600;flex:1}
.res-num{font-size:22px;font-weight:600;line-height:1}
.res-metric{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);margin-top:4px}
.res-metric b{color:var(--text);font-weight:600;font-size:12.5px}
.res .progress.sm{margin:0}
.res-status{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.res-status.is-warn{color:var(--mid)}.res-status.is-err{color:var(--high)}
.week{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;height:150px;align-items:end;margin-top:4px}
.wk-day{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.wk-n{font-size:12px;color:var(--muted)}
.wk-bar{flex:1;width:100%;max-width:46px;display:flex;align-items:flex-end;background:var(--surface-2);border-radius:6px;overflow:hidden}
.wk-bar i{display:block;width:100%;background:color-mix(in srgb,var(--accent) 35%,var(--surface-2));border-radius:6px 6px 0 0}
.wk-d{font-size:12px;color:var(--muted)}
.wk-day.is-today .wk-bar i{background:var(--accent)}
.wk-day.is-today .wk-d,.wk-day.is-today .wk-n{color:var(--text);font-weight:600}
.week-sum{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.week-sum b{color:var(--text);font-weight:600}
.now-head{font-size:12px;color:var(--muted);margin:4px 0 2px;padding-top:10px;border-top:1px solid var(--line)}
.card-head+.change{border-top:0;padding-top:0}
.date-row{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.card-head+.date-row{border-top:0;padding-top:0}
.date-d{font-size:12.5px;font-weight:600}
.date-row .t{font-size:13.5px}
.date-row.is-high .date-d{color:var(--high)}
@media (max-width:980px){.res-grid{grid-template-columns:1fr}}
/* Головна: колонки однакової висоти, остання картка в кожній дотягується донизу */
.start-grid{align-items:stretch}
.start-grid>.col>.card:last-child{flex:1}
.changes-wide{margin-top:var(--gap)}
.res-wide{margin-top:var(--gap)}
.res-wide .res-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1180px){.res-wide .res-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.res-wide .res-grid{grid-template-columns:1fr}}

</style>
<style>/* graphite.css */
/* =====================================================================
   Graphite on ivory — shared colour tokens for variants 9–13.
   Light = warm ivory paper + graphite ink. Dark = warm slate, cream text.
   Contrast: text ≈ 14:1 (light) / 12:1 (dark); muted text ≥ 4.5:1.
   Variants override only shape / typography tokens.
   ===================================================================== */
html[data-theme]{
  --bg:#f3efe7; --surface:#fbf9f5; --surface-2:#efeae1; --line:#e1dacd; --text:#2a2723; --muted:#69645b; --faint:#a19a8e;
  --accent:#34312c; --accent-ink:#faf7f1; --accent-soft:#ebe6dc;
  --lec:#6d5a78; --pr:#5a6a35; --lab:#8f4e30; --high:#ad4636; --mid:#a07526; --ok:#5a6a35; --low:#968f84;
  --nav-bg:var(--surface); --nav-text:var(--muted); --nav-strong:var(--text); --nav-active-bg:var(--surface-2); --nav-active-text:var(--text); --nav-line:var(--line);
  --lec-soft:color-mix(in srgb,var(--lec) 12%,var(--surface)); --pr-soft:color-mix(in srgb,var(--pr) 13%,var(--surface)); --lab-soft:color-mix(in srgb,var(--lab) 12%,var(--surface));
  --track:var(--surface-2); --bar:var(--accent);
  --hero-bg:var(--accent); --hero-text:var(--accent-ink); --hero-muted:color-mix(in srgb,var(--accent-ink) 62%,transparent);
  --hero-track:color-mix(in srgb,var(--accent-ink) 18%,transparent); --hero-bar:var(--accent-ink);
  --heat0:var(--surface-2); --heat1:color-mix(in srgb,var(--accent) 20%,var(--surface-2)); --heat2:color-mix(in srgb,var(--accent) 42%,var(--surface-2));
  --heat3:color-mix(in srgb,var(--accent) 68%,var(--surface-2)); --heat4:var(--accent);
  --h-transform:none; --h-spacing:-.015em;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1f1d1a; --surface:#272420; --surface-2:#2f2b27; --line:#3a3631; --text:#e7e1d6; --muted:#aaa295; --faint:#7a7367;
  --accent:#e2d9c8; --accent-ink:#1f1d1a; --accent-soft:#34302b;
  --lec:#c3b1d1; --pr:#b9c58f; --lab:#e2a786; --high:#e3907f; --mid:#dab26b; --ok:#b9c58f; --low:#8b8478;
  /* у темній темі «головна» картка не світиться — це втомлює очі */
  --hero-bg:var(--surface-2); --hero-text:var(--text); --hero-muted:var(--muted); --hero-track:var(--line); --hero-bar:var(--accent);
}
body{transition:background .2s,color .2s}
.live{color:currentColor}
html[data-theme="dark"] .icon-btn .dot{border-color:var(--surface)}

/* prototype-only theme switcher */
.theme-btn .icon{width:17px;height:17px}
.pal{position:fixed;left:50%;transform:translateX(-50%);bottom:62px;z-index:999;display:flex;gap:2px;padding:4px;border-radius:10px;background:rgba(28,26,23,.94);font:500 12px/1 system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.pal button{all:unset;cursor:pointer;color:#cfc8bc;padding:8px 12px;border-radius:7px}
.pal button.on{background:#f4efe6;color:#1f1d1a}
.embed .pal{display:none}
@media (max-width:980px){.pal{left:8px;transform:none}}

</style>
<style>/* ink-palettes.css */
/* =====================================================================
   10 palettes for the «Чорнило» variant.
   Each palette = 3 base colours:
     --ink    dark sidebar / text colour
     --paper  light page colour
     --seed   accent (buttons, active states)
   Everything else is derived below, for light and dark themes.
   ===================================================================== */
html[data-palette="graphite"]  { --ink:#2b2824; --paper:#f3efe7; --seed:#34312c; }
html[data-palette="mocha"]     { --ink:#2e241d; --paper:#f4ede5; --seed:#5b4433; }
html[data-palette="terracotta"]{ --ink:#33231d; --paper:#f6eee7; --seed:#9c4e2b; }
html[data-palette="wine"]      { --ink:#2d1c21; --paper:#f5efed; --seed:#6e2836; }
html[data-palette="plum"]      { --ink:#2a2130; --paper:#f3eff2; --seed:#5f4472; }
html[data-palette="olive"]     { --ink:#2c2f22; --paper:#f2f1e7; --seed:#535d2f; }
html[data-palette="pine"]      { --ink:#1e2c27; --paper:#eef1ec; --seed:#2f4c41; }
html[data-palette="petrol"]    { --ink:#1d2c2f; --paper:#edf1f0; --seed:#2c5458; }
html[data-palette="x-mosaic"]     { --ink:#262a2f; --paper:#eff0f0; --seed:#3d4651; }
html[data-palette="ochre"]     { --ink:#2e281b; --paper:#f5f0e3; --seed:#755815; }

/* ---------- light: paper page, ink sidebar ---------- */
html[data-theme][data-palette]{
  --bg:var(--paper);
  --surface:color-mix(in srgb,var(--paper) 40%,#fff);
  --surface-2:color-mix(in srgb,var(--paper) 94%,var(--ink));
  --line:color-mix(in srgb,var(--paper) 85%,var(--ink));
  --text:var(--ink);
  --muted:color-mix(in srgb,var(--ink) 70%,var(--paper));
  --faint:color-mix(in srgb,var(--ink) 44%,var(--paper));
  --accent:var(--seed); --accent-ink:color-mix(in srgb,var(--paper) 40%,#fff);
  --accent-soft:color-mix(in srgb,var(--seed) 10%,var(--surface));
  --nav-bg:var(--ink);
  --nav-text:color-mix(in srgb,var(--paper) 64%,var(--ink));
  --nav-strong:var(--paper); --nav-active-text:var(--paper);
  --nav-active-bg:color-mix(in srgb,var(--paper) 9%,transparent);
  --nav-line:color-mix(in srgb,var(--paper) 11%,transparent);
  --nav-mark:color-mix(in srgb,var(--seed) 35%,var(--paper));
  --hero-bg:var(--surface); --hero-text:var(--text); --hero-muted:var(--muted); --hero-track:var(--surface-2); --hero-bar:var(--accent);
  --track:var(--surface-2); --bar:var(--accent);
}
/* ---------- dark: the ink becomes the room, paper becomes the chalk ---------- */
html[data-theme="dark"][data-palette]{
  --bg:color-mix(in srgb,var(--ink) 86%,#000);
  --surface:color-mix(in srgb,var(--ink) 94%,#fff);
  --surface-2:color-mix(in srgb,var(--ink) 90%,#fff);
  --line:color-mix(in srgb,var(--ink) 80%,#fff);
  --text:color-mix(in srgb,var(--paper) 92%,var(--ink));
  --muted:color-mix(in srgb,var(--paper) 69%,var(--ink));
  --faint:color-mix(in srgb,var(--paper) 40%,var(--ink));
  --accent:color-mix(in srgb,var(--seed) 38%,var(--paper)); --accent-ink:color-mix(in srgb,var(--ink) 86%,#000);
  --accent-soft:color-mix(in srgb,var(--accent) 12%,var(--surface));
  --lec-soft:color-mix(in srgb,var(--lec) 9%,var(--surface)); --pr-soft:color-mix(in srgb,var(--pr) 9%,var(--surface)); --lab-soft:color-mix(in srgb,var(--lab) 9%,var(--surface));
  --nav-bg:color-mix(in srgb,var(--ink) 70%,#000);
  --nav-text:color-mix(in srgb,var(--paper) 56%,var(--ink));
  --nav-active-bg:color-mix(in srgb,var(--paper) 7%,transparent);
  --nav-line:color-mix(in srgb,var(--paper) 9%,transparent);
  --hero-bg:var(--surface); --hero-text:var(--text); --hero-muted:var(--muted); --hero-track:var(--surface-2); --hero-bar:var(--accent);
}
html[data-palette]{
  --heat0:var(--surface-2);
  --heat1:color-mix(in srgb,var(--accent) 20%,var(--surface-2)); --heat2:color-mix(in srgb,var(--accent) 42%,var(--surface-2));
  --heat3:color-mix(in srgb,var(--accent) 68%,var(--surface-2)); --heat4:var(--accent);
}
/* public page has no dark sidebar behind the logo — use the accent instead of paper */
html[data-palette] .pub-head .brand-mark{background:var(--accent);color:var(--accent-ink)}

</style>
<style>/* slate-lab.css */
/* =====================================================================
   «Сланець» + 4 colour experiments (loaded after ink-palettes.css).
   slate  — base (derived from 3 seeds in ink-palettes.css)
   mono   — 1 hue, 7-step scale; red only for errors
   copper — 2 colours: cool slate + one warm copper accent
   triad  — 3 hues: slate + sage + sand, pastel tints per block
   depth  — 1 hue, tonal layers, no lines; page is not white
   ===================================================================== */

/* ---------- MONO ---------- */
html[data-palette="mono"]{ --ink:#23282e; --paper:#eceef0; --seed:#39414a; }
html[data-theme][data-palette="mono"]{
  --bg:#eceef0; --surface:#f8f9fa; --surface-2:#e3e6e9; --line:#d3d8dd; --text:#23282e; --muted:#5b6570; --faint:#8a939d;
  --accent:#39414a; --accent-ink:#f8f9fa; --nav-bg:#23282e; --nav-text:#a9b1ba; --nav-mark:#b9c0c8;
  --lec:#23282e; --pr:#6b7682; --lab:#b0b8c0; --high:#b0443a; --mid:#5b6570; --ok:#39414a; --low:#8a939d;
  --heat1:#d3d8dd; --heat2:#aeb6bf; --heat3:#6b7682; --heat4:#23282e;
}
html[data-theme="dark"][data-palette="mono"]{
  --bg:#1b1f23; --surface:#22272c; --surface-2:#2a3036; --line:#343b42; --text:#e3e7eb; --muted:#9aa3ad; --faint:#6b747e;
  --accent:#c9d0d7; --accent-ink:#1b1f23; --nav-bg:#14171a; --nav-text:#8f99a3; --nav-mark:#c9d0d7;
  --lec:#e3e7eb; --pr:#9aa3ad; --lab:#5b6570; --high:#e0857b; --mid:#9aa3ad; --ok:#c9d0d7; --low:#6b747e;
  --heat1:#2f363d; --heat2:#46505a; --heat3:#76818c; --heat4:#c9d0d7;
}
/* у моно тип заняття — це відтінок кружечка, текст завжди основного кольору */
html[data-palette="mono"] .badge{background:var(--surface-2)!important;color:var(--text)!important}
html[data-palette="mono"] .badge-lec::before,html[data-palette="mono"] .badge-pr::before,html[data-palette="mono"] .badge-lab::before{content:'';width:7px;height:7px;border-radius:50%;margin-right:6px;box-shadow:0 0 0 1px var(--line)}
html[data-palette="mono"] .badge-lec::before{background:var(--lec)}
html[data-palette="mono"] .badge-pr::before{background:var(--pr)}
html[data-palette="mono"] .badge-lab::before{background:var(--lab)}

/* ---------- COPPER (2 кольори) ---------- */
html[data-palette="copper"]{ --ink:#262a2f; --paper:#eff0f0; --seed:#a3562f; }
html[data-theme][data-palette="copper"]{
  --bg:#eff0f0; --surface:#fafafa; --surface-2:#e6e8ea; --line:#d6dadd; --text:#262a2f; --muted:#5b636c; --faint:#949ba3;
  --accent:#a3562f; --accent-ink:#fff; --nav-bg:#262a2f; --nav-text:#a8b0b8; --nav-mark:#d99a72;
  --lec:#2f363e; --pr:#924c29; --lab:#5f6973; --high:#b0443a; --mid:#93641a; --ok:#2f363e; --low:#949ba3;
}
html[data-theme="dark"][data-palette="copper"]{
  --bg:#1c1f23; --surface:#23272c; --surface-2:#2b3036; --line:#353b42; --text:#e4e7ea; --muted:#9aa2ab; --faint:#6c747d;
  --accent:#e0966b; --accent-ink:#1c1f23; --nav-bg:#15181b; --nav-text:#8f98a2; --nav-mark:#e0966b;
  --lec:#c5ccd3; --pr:#e0966b; --lab:#8f98a2; --high:#e3857a; --mid:#e0b06b; --ok:#c5ccd3; --low:#6c747d;
}
html[data-palette="copper"] .hero-value{color:var(--accent)}
html[data-palette="copper"] .now-card{border-left:3px solid var(--accent)}
html[data-palette="copper"] .live{color:var(--accent)}

/* ---------- TRIAD (3 кольори) ---------- */
html[data-palette="triad"]{ --ink:#2b3138; --paper:#f1efe9; --seed:#4b6657; }
html[data-theme][data-palette="triad"]{
  --bg:#f1efe9; --surface:#fbfaf7; --surface-2:#ebe7de; --line:#ddd8cc; --text:#262a2f; --muted:#5d6268; --faint:#999b9b;
  --accent:#4b6657; --accent-ink:#fbfaf7; --nav-bg:#2b3138; --nav-text:#aeb5bd; --nav-strong:#f1efe9; --nav-mark:#a9c2b3;
  --lec:#536173; --pr:#4b6657; --lab:#85502f; --high:#b0473b; --mid:#966b1e; --ok:#4b6657; --low:#999b9b;
  --tint-1:#ece5d6; --tint-2:#e2ebe4; --tint-3:#f1e3d8;
  --hero-bg:#2b3138; --hero-text:#f1efe9; --hero-muted:rgba(241,239,233,.66); --hero-track:rgba(241,239,233,.18); --hero-bar:#a9c2b3;
}
html[data-theme="dark"][data-palette="triad"]{
  --bg:#1c1f23; --surface:#24282d; --surface-2:#2c3036; --line:#363b41; --text:#e6e4de; --muted:#a3a29c; --faint:#727470;
  --accent:#a3c0ae; --accent-ink:#1c1f23; --nav-bg:#15181b; --nav-text:#959ca3; --nav-mark:#a3c0ae;
  --lec:#b0bccb; --pr:#a3c0ae; --lab:#dca47d; --high:#e3887c; --mid:#dcb26b; --ok:#a3c0ae; --low:#727470;
  --tint-1:#2e2b25; --tint-2:#26302a; --tint-3:#33291f;
  --hero-bg:#2a3530; --hero-text:#e6e4de; --hero-muted:#a3a29c; --hero-track:#3a4640; --hero-bar:#a3c0ae;
}
html[data-palette^="tri"] .hero{border-color:transparent}
html[data-palette^="tri"] .btn-hero{color:var(--hero-text);border-color:var(--hero-track)}
html[data-palette^="tri"] .home-top .kpi{border-color:transparent}
html[data-palette^="tri"] .home-top .kpi:nth-child(2){background:var(--tint-1)}
html[data-palette^="tri"] .home-top .kpi:nth-child(3){background:var(--tint-2)}
html[data-palette^="tri"] .home-top .kpi:nth-child(4){background:var(--tint-3)}
html[data-palette^="tri"] .md-row.is-active{background:var(--tint-2)}
html[data-palette^="tri"] .now-card{background:var(--tint-2);border-color:transparent;color:var(--text);
  --hero-text:var(--text); --hero-muted:var(--muted); --hero-track:color-mix(in srgb,var(--text) 12%,transparent); --hero-bar:var(--accent)}
html[data-palette^="tri"] .next-card{background:var(--tint-1);border-color:transparent}
html[data-palette^="tri"] .step.is-cur{background:var(--tint-2)}

/* ---------- DEPTH (тонові шари, без ліній) ---------- */
html[data-palette="depth"]{ --ink:#39414a; --paper:#dde1e5; --seed:#2d343b; }
html[data-theme][data-palette="depth"]{
  --bg:#dde1e5; --surface:#f3f5f7; --surface-2:#e8ebee; --line:#e3e6e9; --text:#23282e; --muted:#556069; --faint:#88919a;
  --accent:#2d343b; --accent-ink:#f3f5f7; --nav-bg:#39414a; --nav-text:#b7bfc7; --nav-strong:#f3f5f7; --nav-mark:#f3f5f7;
  --lec:#4c5a6a; --pr:#4f6b58; --lab:#82502f; --high:#ad4538; --mid:#93681c; --ok:#4f6b58; --low:#88919a;
  --hero-bg:#2d343b; --hero-text:#f3f5f7; --hero-muted:rgba(243,245,247,.66); --hero-track:rgba(243,245,247,.18); --hero-bar:#f3f5f7;
  --card-border:0;
}
html[data-theme="dark"][data-palette="depth"]{
  --bg:#15181b; --surface:#21252a; --surface-2:#292e34; --line:#2a2f35; --text:#e3e7eb; --muted:#9ba4ad; --faint:#6b737c;
  --accent:#cdd4db; --accent-ink:#15181b; --nav-bg:#2a3037; --nav-text:#a5aeb7; --nav-strong:#e9edf0; --nav-mark:#cdd4db;
  --lec:#b3bfcc; --pr:#a9c2b0; --lab:#d9a17f; --high:#e3857a; --mid:#dcb06b; --ok:#a9c2b0; --low:#6b737c;
  --hero-bg:#2b3238; --hero-text:#e3e7eb; --hero-muted:#9ba4ad; --hero-track:#3a4148; --hero-bar:#cdd4db;
}
html[data-palette="depth"] .hero,html[data-palette="depth"] .now-card{border:0}
html[data-palette="depth"] .search,html[data-palette="depth"] .icon-btn{border:0}
html[data-palette="depth"] .btn{border-color:transparent;background:var(--surface-2)}
html[data-palette="depth"] .btn-primary{background:var(--accent)}
html[data-palette="depth"] .btn-hero{background:rgba(255,255,255,.1);color:var(--hero-text)}
html[data-palette="depth"] .chip{border:0;background:var(--surface-2)}
html[data-palette="depth"] .chip.is-on{background:var(--accent)}
html[data-palette="depth"] .md-list{border-right:0;background:color-mix(in srgb,var(--surface-2) 60%,var(--surface))}
html[data-palette="depth"] .md-search{border:0}
html[data-palette="depth"] .day{border:0}
html[data-palette="depth"] .steps .step{border-right-color:var(--bg)}

/* =====================================================================
   TRIAD FAMILY — 5 more three-colour combinations (same rules as triad:
   dark nav · warm paper · one accent · three pastel tints for blocks)
   ===================================================================== */

/* ---------- Сутінки: слива + пильна троянда + крем ---------- */
html[data-palette="tri-dusk"]{ --ink:#2e2833; --paper:#f4efe9; --seed:#844b5b; }
html[data-theme][data-palette="tri-dusk"]{
  --bg:#f4efe9; --surface:#fcfaf8; --surface-2:#ede6df; --line:#e0d6ce; --text:#2a2430; --muted:#625a66; --faint:#9d949f;
  --accent:#844b5b; --accent-ink:#fcfaf8; --nav-bg:#2e2833; --nav-text:#b3aab6; --nav-strong:#f4efe9; --nav-mark:#d7a9b5;
  --lec:#5d4f78; --pr:#844b5b; --lab:#835c2e; --high:#b0473b; --mid:#93681c; --ok:#4f6b58; --low:#9d949f;
  --tint-1:#f1e7da; --tint-2:#e8e3ef; --tint-3:#f4e2e5;
  --hero-bg:#2e2833; --hero-text:#f4efe9; --hero-muted:rgba(244,239,233,.66); --hero-track:rgba(244,239,233,.18); --hero-bar:#d7a9b5;

<script>/* theme.js */
/* Light / dark theme for variants 9–13.
   initTheme(key)  — call BEFORE renderApp (sets data-theme early, no flash)
   mountThemeToggle(key) — call AFTER renderApp (adds the toggle buttons)   */
(function () {
  const get = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const set = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const root = document.documentElement;
  const SUN = '<svg class="icon" viewBox="0 0 24 24"><path d="M12 17a5 5 0 100-10 5 5 0 000 10zM12 1.5v2M12 20.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M1.5 12h2M20.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>';
  const MOON = '<svg class="icon" viewBox="0 0 24 24"><path d="M20.5 13.2A8.5 8.5 0 1110.8 3.5a6.6 6.6 0 009.7 9.7z"/></svg>';

  window.initTheme = (key) => {
    root.dataset.theme = new URLSearchParams(location.search).get('t') || get(key) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  };
  window.mountThemeToggle = (key) => {
    const btn = '<button class="icon-btn theme-btn" aria-label="Перемкнути тему"></button>';
    document.querySelectorAll('.topbar .search').forEach((s) => s.insertAdjacentHTML('afterend', btn));
    document.querySelector('.pub-head .btn')?.insertAdjacentHTML('beforebegin', btn);
    document.body.insertAdjacentHTML('beforeend', '<div class="pal"><button data-th="light">Світла</button><button data-th="dark">Темна</button></div>');
    const sync = () => {
      const dark = root.dataset.theme === 'dark';
      document.querySelectorAll('.theme-btn').forEach((b) => { b.innerHTML = dark ? SUN : MOON; b.title = dark ? 'Світла тема' : 'Темна тема'; });
      document.querySelectorAll('[data-th]').forEach((b) => b.classList.toggle('on', b.dataset.th === root.dataset.theme));
    };
    document.addEventListener('click', (e) => {
      if (e.target.closest('.theme-btn')) { root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'; set(key, root.dataset.theme); }
      const t = e.target.closest('[data-th]'); if (t) { root.dataset.theme = t.dataset.th; set(key, t.dataset.th); }
      sync();
    });
    sync();
  };
})();

</script>

      const t = e.target.closest('[data-to]'); if (t) go(t.dataset.to);
      if (e.target.closest('.how-close')) { document.getElementById('welcome').classList.add('is-hidden'); try { localStorage.setItem('how-hidden', '1'); } catch (er) {} }
      if (e.target.closest('.how-open')) { document.getElementById('welcome').classList.remove('is-hidden'); try { localStorage.removeItem('how-hidden'); } catch (er) {} }
      const tg = e.target.closest('.task-toggle'); if (tg) tg.closest('.task').classList.toggle('is-open');
      const seg = e.target.closest('.seg button'); if (seg) seg.parentElement.querySelectorAll('button').forEach((b) => b.classList.toggle('is-on', b === seg));
      const chip = e.target.closest('.md-filters .chip'); if (chip) chip.parentElement.querySelectorAll('.chip').forEach((c) => c.classList.toggle('is-on', c === chip));
      const cell = e.target.closest('.avail .c'); if (cell) cell.classList.toggle('off');
      const opt = e.target.closest('.fix-opt'); if (opt) opt.parentElement.querySelectorAll('.fix-opt').forEach((o) => o.classList.toggle('is-sel', o === opt));
    });

    /* directory */
    let sel = 0;
    const rows = () => document.getElementById('mdRows').innerHTML = TEACHERS.map((t, i) => `
      <div class="md-row ${i === sel ? 'is-active' : ''}" data-i="${i}"><span class="avatar">${initials(t.n)}</span>
        <div class="grow"><div class="name">${t.n}</div><div class="meta">${t.subj.join(', ') || 'Без предметів'}</div></div>
        <span class="num ${t.load >= t.max ? 'warn' : ''}">${t.load}/${t.max}</span></div>`).join('');
    const showDetail = () => document.getElementById('mdDetail').innerHTML = detail(TEACHERS[sel]);
    document.getElementById('mdRows').addEventListener('click', (e) => { const r = e.target.closest('.md-row'); if (r) { sel = +r.dataset.i; rows(); showDetail(); } });
    rows(); showDetail();

    /* public */
    let day = 3;
    const pubRender = () => {
      document.getElementById('days').innerHTML = DAYS.map((d, i) => `<div class="day ${i === day ? 'is-active' : ''} ${i === 3 ? 'is-today' : ''}" data-d="${i}"><span class="dw">${d}</span><span class="dn">${16 + i}</span><span class="dc">${LESSONS.filter((l) => l.d === i).length || ''}</span></div>`).join('');
      const ls = LESSONS.filter((l) => l.d === day).sort((a, b) => a.p - b.p);
      document.getElementById('lessons').innerHTML = `<div class="lessons-head">${DAYS_FULL[day]}, ${16 + day} листопада</div>` + (ls.length ? ls.map((l) => `
        <div class="lesson ${day === 3 && l.p < 2 ? 'is-past' : ''} ${day === 3 && l.p === 2 ? 'is-now' : ''}"><div class="l-time"><b>${PAIRS[l.p][0]}</b><span>${PAIRS[l.p][1]}</span></div>
        <div class="l-body"><div class="l-title">${l.s}</div><div class="l-meta">${l.tc} · ауд. ${l.r}</div></div><span class="badge badge-${l.t}">${TYPE[l.t]}</span></div>`).join('')
        : `<div class="empty"><div class="empty-ico">${ic('calendar')}</div><div>Пар немає</div></div>`);
    };
    document.getElementById('days').addEventListener('click', (e) => { const d = e.target.closest('.day'); if (d) { day = +d.dataset.d; pubRender(); } });
    pubRender();

    if (calm) { // laconic mode: drop secondary noise
      document.body.classList.add('calm');
      document.querySelectorAll('.task.is-open').forEach((t) => t.classList.remove('is-open'));
      document.querySelectorAll('kbd, .legend, .task-group-label span').forEach((e) => e.remove());
      document.querySelectorAll('.nav-count').forEach((e, i) => { if (i) e.remove(); });
      document.querySelectorAll('.heat').forEach((h) => h.closest('.card').remove());
    }
    if (window.top !== window) document.body.classList.add('embed'); // gallery thumbnails: hide the screen switcher
    try { if (localStorage.getItem('how-hidden')) document.getElementById('welcome').classList.add('is-hidden'); } catch (er) {}
    const first = new URLSearchParams(location.search).get('s'); go(first || 'start');
  };
})();

</script>
<script>
const PALETTES = [['slate','Сланець'],['mono','Моно'],['copper','Мідь'],['triad','Тріада'],['depth','Глибина'],['tri-dusk','Тріада · Сутінки'],['tri-forest','Тріада · Ліс'],['tri-sea','Тріада · Море'],['tri-clay','Тріада · Глина'],['tri-retro','Тріада · Ретро'],['x-vivid','Соковитий'],['x-airy','Повітря'],['x-jewel','Коштовності'],['x-mosaic','Мозаїка'],['x-duo','Дуотон']];
(function () {
  const root = document.documentElement;
  const get = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const set = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  root.dataset.palette = 'x-mosaic';
  initTheme('final-x-mosaic-theme');
  renderApp({ name: 'Мозаїка', calm: true });
  mountThemeToggle('final-x-mosaic-theme');
})();
</script>
