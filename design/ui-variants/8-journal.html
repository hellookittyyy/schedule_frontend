<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI 8 — Журнал</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="look.css">
<style>
/* =====================================================================
   8 · ЖУРНАЛ — графіт + слонова кістка з власною мовою форм.
   Світла тема — паперовий журнал: графітове чорнило, лінійки, червоне поле.
   Темна тема  — грифельна дошка: теплий темний сланець, крейдяний текст.
   Свідомо НЕ використовуємо типові «шаблонні» прийоми:
     × скруглені картки з тінню        → лінійки й розділювачі
     × ряд KPI-карток                  → одна «шапка» з показниками
     × іконка біля кожного пункту меню → нумерований зміст 01, 02…
     × пігулки-бейджі                  → квадратна мітка + текст
     × КАПС-підписи                    → курсив серифом
     × нейтральний гротеск усюди       → Spectral + Commissioner + JetBrains Mono для цифр
   ===================================================================== */
html[data-theme]{
  --font:'Commissioner',system-ui,sans-serif; --font-head:'Spectral',Georgia,serif; --font-num:'JetBrains Mono',ui-monospace,monospace;
  --bg:#f1ede5; --surface:#f6f3ec; --surface-2:#e9e4d9; --line:#d9d2c4; --rule:#3d3a35; --text:#2a2723; --muted:#68625a; --faint:#9a9387;
  --accent:#3d3a35; --accent-ink:#f6f3ec; --accent-soft:#e6e0d4; --margin:#c0574a;
  --lec:#6d5a78; --pr:#5a6a35; --lab:#8f4e30; --high:#b3473b; --mid:#a07526; --ok:#5a6a35; --low:#968f84;
  --nav-bg:var(--bg); --nav-text:var(--text); --nav-strong:var(--text); --nav-active-bg:transparent; --nav-active-text:var(--text); --nav-line:var(--line);
  --radius:0; --radius-sm:0; --btn-radius:2px; --pill:0; --card-border:0; --card-shadow:none; --pad:0; --gap:30px;
  --hero-bg:transparent; --hero-text:var(--text); --hero-muted:var(--muted); --hero-track:var(--line); --hero-bar:var(--text);
  --track:var(--line); --bar:var(--text);
  --heat0:var(--surface-2); --heat1:color-mix(in srgb,var(--text) 18%,var(--surface-2)); --heat2:color-mix(in srgb,var(--text) 38%,var(--surface-2));
  --heat3:color-mix(in srgb,var(--text) 62%,var(--surface-2)); --heat4:var(--text);
  --title-size:42px; --title-weight:400; --h2-size:21px; --h-transform:none; --h-spacing:-.01em; --nav-w:230px;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#23211e; --surface:#23211e; --surface-2:#2c2a26; --line:#3b3833; --rule:#d2c9b9; --text:#e6e0d5; --muted:#aaa295; --faint:#7a746b;
  --accent:#e0d7c6; --accent-ink:#23211e; --accent-soft:#33302b; --margin:#b9695d;
  --lec:#c3b1d1; --pr:#b9c58f; --lab:#e2a786; --high:#e3907f; --mid:#dab26b; --ok:#b9c58f; --low:#8b8478;
}
body{font-size:14.5px;line-height:1.55;transition:background .2s,color .2s}
.icon{stroke-width:1.5}
.num,.room,.l-time,.nav-count,kbd{font-family:var(--font-num);font-size:12px}

/* ---------- зміст (навігація) ---------- */
.nav{border-right:1px solid var(--line);padding:34px 24px;gap:0;counter-reset:nav}
.nav-brand{flex-direction:column;align-items:flex-start;gap:2px;padding:0 0 30px}
.brand-mark{display:none}
.brand-name{font-family:var(--font-head);font-size:26px;font-weight:500;letter-spacing:-.01em;text-transform:none;color:var(--text)}
.nav-brand::after{content:'ф-т компʼютерних наук';font-family:var(--font-head);font-style:italic;font-size:14px;color:var(--muted)}
.nav-group{margin-bottom:18px;gap:0}
.nav-label{font-family:var(--font-head);font-style:italic;font-size:15px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted);padding:0 0 4px}
.nav-item{padding:4px 0;border-radius:0;gap:0;font-weight:400;color:var(--text);counter-increment:nav}
.nav-item .icon{display:none}
.nav-item::before{content:counter(nav,decimal-leading-zero);font-family:var(--font-num);font-size:11px;color:var(--faint);width:30px;flex:none}
.nav-item:hover{background:none;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.nav-item.is-active{background:none;font-weight:600}
.nav-item.is-active::before{content:'→';color:var(--margin);font-family:var(--font)}
.nav-count{color:var(--faint);font-size:11px}
.nav-foot .nav-item::before{content:'—'}
.nav-user{border-top:1px solid var(--line);padding:14px 0 0;gap:10px}
.avatar{background:none;border:1px solid var(--line);border-radius:0;font-family:var(--font-num);font-size:11px;color:var(--text);font-weight:500}
.nav-user-role{font-family:var(--font-head);font-style:italic;font-size:13px}

/* ---------- сторінка з полем ---------- */
.main{position:relative;padding:38px 48px 90px 74px}
.main::before{content:'';position:absolute;top:0;bottom:0;left:48px;width:1px;background:var(--margin);opacity:.55}
.topbar{align-items:flex-end;border-bottom:2px solid var(--rule);padding-bottom:16px;margin-bottom:30px}
.crumbs{font-family:var(--font-head);font-style:italic;font-size:16px;color:var(--muted);text-transform:none;margin-bottom:0}
.page-title{line-height:1.05}
.search{border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;height:34px;padding:0 2px;width:230px}
.search .icon{width:15px;height:15px}
kbd{border:0;color:var(--faint);padding:0;font-size:11px}
.icon-btn{border:0;background:none;width:34px;height:34px}
.icon-btn .dot{border-color:var(--bg);background:var(--margin)}

/* ---------- кнопки: одна суцільна, решта — підкреслені дії ---------- */
.btn{height:auto;padding:8px 16px;border:1px solid var(--rule);background:transparent;border-radius:2px;font-weight:500;color:var(--text)}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn-primary:hover{background:var(--accent);opacity:.88}
.btn-ghost{border-color:var(--line)}
.btn-sm,.btn-hero{padding:0;border:0;background:none!important;color:var(--text)!important;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;font-size:13.5px;height:auto;opacity:1}
.btn-sm::after{content:'→';margin-left:6px;text-decoration:none;display:inline-block}
.btn-sm.btn-primary{font-weight:600}
.btn-hero .icon{width:14px;height:14px}

/* ---------- «шапка» з показниками замість KPI-карток ---------- */
.home-top{gap:0;border-bottom:1px solid var(--line);margin-bottom:38px}
.home-top>.card{padding:2px 24px 20px;border-left:1px solid var(--line);background:none}
.home-top>.card:first-child{border-left:0;padding-left:0}
.hero{gap:8px}
.hero-label,.kpi-label{font-family:var(--font-head);font-style:italic;font-size:16px;color:var(--muted);text-transform:none;letter-spacing:0}
.hero-value{font-family:var(--font-head);font-weight:400;font-size:76px;letter-spacing:-.03em;line-height:.95}
.hero-value small{font-size:32px}
.hero-note{font-family:var(--font-num);font-size:12px}
.hero .progress,.kpi .progress{height:2px;border-radius:0}
.kpi-value{font-family:var(--font-head);font-weight:400;font-size:46px;letter-spacing:-.02em;margin-top:2px}
.kpi-value small{font-family:var(--font-num);font-size:13px}
.kpi-note{font-family:var(--font-num);font-size:12px}

/* ---------- розділи: заголовок над лінійкою ---------- */
.card{background:none}
.card-head{border-bottom:2px solid var(--rule);padding-bottom:8px;margin-bottom:0}
.card-title{font-weight:500}
.card-head .muted.sm{font-family:var(--font-head);font-style:italic;font-size:14px}
.seg{background:none;padding:0;gap:16px}
.seg button{padding:0 0 1px;border-radius:0;color:var(--muted);font-size:13.5px;border-bottom:1px solid transparent}
.seg button.is-on{background:none;box-shadow:none;color:var(--text);border-bottom-color:var(--text)}

/* ---------- задачі ---------- */
.task-group+.task-group{margin-top:8px}
.task-group-label{font-family:var(--font-head);font-style:italic;font-size:15px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);padding:16px 0 4px}
.task-group-label span{font-size:12px}
.sev{width:8px;height:8px;border-radius:0}
.task{border-top:1px solid var(--line);padding:13px 0}
.task-group-label+.task{border-top:0}
.sev-ico{background:none;width:26px;height:auto;justify-content:start;font-family:var(--font-num);font-size:13px;font-weight:500;color:var(--c)}
.sev-ico .icon{display:none}
.sev-ico.sev-high::before{content:'!!'}.sev-ico.sev-mid::before{content:'!'}.sev-ico.sev-low::before{content:'i'}
.task-title{font-weight:500}
.task-meta{font-size:13px}
.task-fix{background:none;border-left:1px solid var(--margin);border-radius:0;padding:4px 0 4px 18px;margin-top:12px}
.fix-label{font-family:var(--font-head);font-style:italic;font-size:14px}
.fix-opt{padding:7px 0;border:0;border-radius:0}
.fix-opt.is-sel{background:none;border:0}
.fix-opt .avatar{display:none}
.fix-opt input{accent-color:var(--text)}
.fix-actions{gap:22px;margin-top:8px}
.tag{background:none;border:1px solid var(--line);border-radius:0;font-family:var(--font-num);font-size:10.5px;font-weight:400;color:var(--muted)}

/* ---------- мітки типів: квадрат + текст ---------- */
.badge{background:none!important;padding:0;height:auto;border-radius:0;font-size:12.5px;color:var(--muted)!important;font-weight:400}
.badge::before{content:'';width:8px;height:8px;margin-right:7px;background:var(--muted)}
.badge-lec::before{background:var(--lec)}.badge-pr::before{background:var(--pr)}.badge-lab::before{background:var(--lab)}
.badge-status{border:1px solid var(--rule);padding:3px 9px;color:var(--text)!important;font-size:12px;vertical-align:middle}
.badge-status::before{display:none}
.today-row{border-top:1px solid var(--line);padding:11px 0}
.today-row:first-of-type{border-top:0}
.today-row .t{font-weight:500}
.heat{gap:2px;margin-top:14px}
.heat i{border-radius:0}
.heat .hd{font-family:var(--font-num);font-size:10.5px}
.legend{font-family:var(--font-num)}
.legend i{border-radius:0}

/* ---------- довідник ---------- */
.md{border-radius:0;overflow:visible;border-top:2px solid var(--rule)}
.md-list{border-right:1px solid var(--line);padding-top:14px}
.md{grid-template-columns:300px minmax(0,1fr)}
.detail-head>.grow{min-width:220px}
.md-search{width:auto;margin:0 18px 0 0;border:0;border-bottom:1px solid var(--line);background:none;border-radius:0}
.md-filters{gap:16px;padding:14px 18px 12px 0}
.chip{height:auto;padding:0 0 1px;border:0;border-bottom:1px solid transparent;border-radius:0;background:none;color:var(--muted);font-size:13px;font-weight:400}
.chip:hover{color:var(--text)}
.chip.is-on{background:none;color:var(--text);border-bottom-color:var(--text)}
.chips{gap:6px 16px}
.chip .icon.xs{width:11px;height:11px;opacity:.6}
.chip-add{border-bottom:1px dashed var(--faint)}
.chip.link{color:var(--text);border-bottom-color:var(--line)}
.md-row{padding:11px 18px 11px 0;border-top:1px solid var(--line)}
.md-row:hover{background:none}.md-row:hover .name{text-decoration:underline;text-underline-offset:3px}
.md-row.is-active{background:none;box-shadow:inset -2px 0 0 var(--margin)}
.md-row.is-active .name{font-weight:600}
.md-row .avatar{width:30px;height:30px}
.md-detail{padding:22px 0 30px 36px}
.avatar.lg{width:56px;height:56px;font-family:var(--font-head);font-size:22px;border-color:var(--rule)}
.detail-name{font-family:var(--font-head);font-size:28px;font-weight:500;line-height:1.15}
.detail-head .muted{font-family:var(--font-head);font-style:italic;font-size:15px}
.saved{font-family:var(--font-num);font-size:11.5px}
.section{margin-top:30px}
.section-title{font-family:var(--font-head);font-style:italic;font-size:17px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--text)}
.section-title .muted{font-size:13px}
.fields{border-top:1px solid var(--rule)}
.f-label{font-size:13.5px}
.status::before{border-radius:0;width:8px;height:8px}
.load .progress{height:2px}
/* доступність — клітинки журналу */
.avail{gap:0;border-top:1px solid var(--rule);border-left:1px solid var(--line);max-width:560px}
.avail>*{border-right:1px solid var(--line);border-bottom:1px solid var(--line);height:32px;display:grid;place-items:center}
.avail .hd{font-family:var(--font-num);font-size:10.5px}
.avail .tm{place-items:center start;padding-left:6px}
.avail .c{border-radius:0;border-width:0 1px 1px 0;border-style:solid;border-color:var(--line);background:none}
.avail .c:hover{background:var(--surface-2)}
.avail .c.off{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--text) 32%,transparent) 0 1px,transparent 1px 6px)}

/* ---------- семестр ---------- */
.steps{border-radius:0;border-top:2px solid var(--rule);border-bottom:1px solid var(--line);margin-bottom:38px;overflow:visible}
.step{padding:14px 18px 14px 0;border-right:0}
.step+.step{padding-left:18px;border-left:1px solid var(--line)}
.step-n{width:auto;height:auto;border:0;display:block;font-family:var(--font-num);font-size:11px;color:var(--faint);margin-bottom:4px;background:none!important}
.step.is-done .step-n{color:var(--ok)}
.step.is-cur{background:none}.step.is-cur .step-n{color:var(--margin)}
.step.is-cur::after{top:-2px;bottom:auto;height:2px;background:var(--margin)}
.step-name{font-family:var(--font-head);font-size:18px;font-weight:500}
.step.is-todo .step-name{color:var(--faint)}
.step-meta{font-family:var(--font-num);font-size:11px}
.check{border-top:1px solid var(--line);padding:12px 0}
.card-head+.check{border-top:0}
.check-ico{border-radius:0;background:none!important;width:18px}
.grp-row{border-top:1px solid var(--line);padding:9px 0}
.grp-row .progress{height:2px}
.grp-row .g{font-family:var(--font-num);font-weight:500;font-size:12px}
.empty{padding:30px 10px}
.empty-ico{border-radius:0;background:none;border:1px solid var(--line)}
.empty .muted{font-family:var(--font-head);font-style:italic;font-size:14px}

/* ---------- публічна: щоденник ---------- */
.pub-wrap{padding:40px 20px 100px}
.pub{max-width:640px;gap:22px;position:relative}
.pub::before{content:'';position:absolute;top:-40px;bottom:-100px;left:-28px;width:1px;background:var(--margin);opacity:.5}
.pub-head .brand-mark{display:none}
.pub-head .brand-name{font-family:var(--font-head);font-size:24px;font-weight:500;text-transform:none;letter-spacing:0}
.pub-search{width:100%;border:0;border-bottom:2px solid var(--rule);border-radius:0;background:none;height:54px;font-size:20px;padding:0}
.pub-search input{font-family:var(--font-head);font-weight:500}
.pub-title h1{font-size:64px;font-weight:400;line-height:1}
.pub-title .muted{font-family:var(--font-head);font-style:italic;font-size:16px}
.now-card{background:none;border:0;border-left:3px solid var(--margin);border-radius:0;padding:2px 0 4px 20px;gap:8px}
.now-top{font-family:var(--font-num);font-size:11.5px}
.now-label{text-transform:none;letter-spacing:0;font-weight:500;color:var(--margin)}
.live{color:var(--margin)}
@keyframes live{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--margin) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.now-title{font-size:32px;font-weight:500;line-height:1.1}
.now-meta{font-size:13.5px}
.now-card .progress{height:2px;border-radius:0;max-width:360px}
.next-card{border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;padding:12px 0;background:none}
.next-label{font-family:var(--font-num);font-size:11.5px}
.next-title{font-family:var(--font-head);font-size:18px;font-weight:500}
.daystrip{gap:0;border-top:2px solid var(--rule);border-bottom:1px solid var(--line)}
.day{background:none;border:0;border-radius:0;padding:10px 0 8px}
.day+.day{border-left:1px solid var(--line)}
.dw{font-family:var(--font-head);font-style:italic;text-transform:none;font-size:13px;letter-spacing:0}
.dn{font-family:var(--font-head);font-size:24px;font-weight:500}
.dc{font-family:var(--font-num);font-size:10.5px}
.day.is-active{background:var(--accent);color:var(--accent-ink)}
.day.is-today:not(.is-active) .dn{color:var(--margin)}
.lessons{background:none;border:0;padding:0}
.lessons-head{font-family:var(--font-head);font-style:italic;font-size:18px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--text);padding:6px 0 8px}
.lesson{grid-template-columns:74px minmax(0,1fr) auto;padding:14px 0;border-top:1px solid var(--line)}
.l-time b{font-size:14px}
.l-title{font-family:var(--font-head);font-size:18px;font-weight:500;line-height:1.25}
.lesson.is-now .l-title::after{content:'← зараз';font-family:var(--font-num);font-size:11px;font-weight:400;color:var(--margin);margin-left:10px}
.pub-foot .btn{border-color:var(--line)}

/* ---------- перемикач теми (прототип) ---------- */
.theme-btn .icon{width:17px;height:17px}
.pal{position:fixed;left:50%;transform:translateX(-50%);bottom:62px;z-index:999;display:flex;gap:2px;padding:4px;border-radius:10px;background:rgba(28,26,23,.94);font:500 12px/1 system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.pal button{all:unset;cursor:pointer;color:#cfc8bc;padding:8px 12px;border-radius:7px}
.pal button.on{background:#f4efe6;color:#1f1d1a}
.embed .pal{display:none}
@media (max-width:980px){
  .main{padding:26px 20px 90px 34px}.main::before{left:20px}
  .home-top>.card{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:12px}
  .pub::before{left:-10px}.pub-title h1{font-size:48px}
}
</style>
</head>
<body>
<script src="shell.js"></script>
<script>
(function () {
  const root = document.documentElement;
  const get = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const set = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  root.dataset.theme = new URLSearchParams(location.search).get('t') || get('jr-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

  renderApp({ name: '8 · Журнал' });

  const SUN = '<svg class="icon" viewBox="0 0 24 24"><path d="M12 17a5 5 0 100-10 5 5 0 000 10zM12 1.5v2M12 20.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M1.5 12h2M20.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>';
  const MOON = '<svg class="icon" viewBox="0 0 24 24"><path d="M20.5 13.2A8.5 8.5 0 1110.8 3.5a6.6 6.6 0 009.7 9.7z"/></svg>';
  const btn = () => `<button class="icon-btn theme-btn" aria-label="Перемкнути тему"></button>`;
  document.querySelectorAll('.topbar .search').forEach((s) => s.insertAdjacentHTML('afterend', btn()));
  document.querySelector('.pub-head .btn').insertAdjacentHTML('beforebegin', btn());
  document.body.insertAdjacentHTML('beforeend', `<div class="pal"><button data-th="light">Папір</button><button data-th="dark">Дошка</button></div>`);

  const sync = () => {
    const dark = root.dataset.theme === 'dark';
    document.querySelectorAll('.theme-btn').forEach((b) => { b.innerHTML = dark ? SUN : MOON; b.title = dark ? 'Світла тема' : 'Темна тема'; });
    document.querySelectorAll('[data-th]').forEach((b) => b.classList.toggle('on', b.dataset.th === root.dataset.theme));
  };
  document.addEventListener('click', (e) => {
    if (e.target.closest('.theme-btn')) { root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'; set('jr-theme', root.dataset.theme); }
    const t = e.target.closest('[data-th]'); if (t) { root.dataset.theme = t.dataset.th; set('jr-theme', t.dataset.th); }
    sync();
  });
  sync();
})();
</script>
</body>
</html>
