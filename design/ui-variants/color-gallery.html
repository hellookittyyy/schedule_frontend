<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colour Lab</title>
<style>
:root{--bg:#f4f3ef;--paper:#fff;--ink:#1c1b19;--muted:#6d6a64;--line:#e3e1db}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
.doc{max-width:1400px;margin:0 auto;padding:34px 24px 80px}
.back{font-size:13px;color:var(--muted);text-decoration:none}
h1{font-size:28px;margin:8px 0 6px;letter-spacing:-.02em}.lead{color:var(--muted);max-width:820px;margin:0}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:16px;align-items:center;padding:18px 0;flex-wrap:wrap}
.seg{display:inline-flex;background:#e7e5df;border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:7px 13px;border-radius:8px;cursor:pointer;font:inherit;color:var(--muted)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.v{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.shot{position:relative;aspect-ratio:1440/900;overflow:hidden;background:#ddd;border-bottom:1px solid var(--line)}
.shot iframe{position:absolute;left:0;top:0;width:1440px;height:900px;border:0;transform-origin:0 0;pointer-events:none}
.shot a{position:absolute;inset:0}
.info{padding:12px 14px;display:flex;align-items:center;gap:10px}
.info b{font-size:15px}.info span{color:var(--muted);font-size:12.5px}
.sw{display:flex;margin-left:auto}.sw i{width:20px;height:20px;border-radius:50%;border:2px solid var(--paper);margin-left:-5px}
</style>
</head>
<body>
<div class="doc">
<a class="back" href="index.html">← Усі варіанти UI</a>
<h1>Кольорова лабораторія: 5 різних підходів</h1>
<p class="lead">Кожен варіант змінює іншу «вісь» кольору: насиченість, яскравість, глибину тону, кількість кольорів. Форми й шрифт «Чорнила» однакові. Кружечки — ключові кольори варіанту. Клік відкриває повну версію.</p>
<div class="bar">
  <div class="seg" id="theme"><button class="on" data-t="light">Світла</button><button data-t="dark">Темна</button></div>
  <div class="seg" id="screen"><button class="on" data-s="home">Задачі</button><button data-s="dir">Викладачі</button><button data-s="sem">Семестр</button><button data-s="pub">Студент</button></div>
</div>
<div class="grid" id="grid"></div>
</div>
<script>
const P=[
 ['x-vivid','Соковитий','насиченість · яскраві кнопки з темним текстом',['#1d1a17','#ff7a3d','#ddf58f','#ddd2ff','#ffd9c4']],
 ['x-airy','Повітря','висока яскравість · світле меню · 1 акцент',['#ecebe6','#ffffff','#c2255c']],
 ['x-jewel','Коштовності','низька яскравість · глибокі тони · золото',['#1a2b24','#d9d5cc','#7a2238','#7d5410','#0f5a46','#e0b341']],
 ['x-mosaic','Мозаїка','6 кольорів · кожен блок свій',['#222024','#ff8f70','#ffd166','#7fd1ae','#a9a6f2','#f4a6c8','#c5e384']],
 ['x-duo','Дуотон','лише 2 кольори · кольорове меню',['#9c4426','#f6efe4']],
];
let t='light',s='home';
const src=p=>`15-slate-lab.html?p=${p}&t=${t}&s=${s}`;
grid.innerHTML=P.map(([k,n,d,c])=>`<div class="v"><div class="shot"><iframe data-p="${k}" src="${src(k)}" loading="lazy" title="${n}"></iframe><a href="${src(k)}" target="_blank"></a></div>
 <div class="info"><b>${n}</b><span>${d}</span><span class="sw">${c.map(x=>`<i style="background:${x}"></i>`).join('')}</span></div></div>`).join('');
const fit=()=>document.querySelectorAll('.shot').forEach(el=>el.querySelector('iframe').style.transform=`scale(${el.clientWidth/1440})`);
addEventListener('resize',fit);fit();
const reload=()=>document.querySelectorAll('.shot').forEach(el=>{const f=el.querySelector('iframe');f.src=src(f.dataset.p);el.querySelector('a').href=src(f.dataset.p)});
const seg=(el,fn)=>el.onclick=e=>{const b=e.target.closest('button');if(!b)return;el.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));fn(b);reload()};
seg(theme,b=>t=b.dataset.t);seg(screen,b=>s=b.dataset.s);
</script>
</body>
</html>
