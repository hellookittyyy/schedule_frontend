<!DOCTYPE html>
<html lang="uk" data-palette="oxford" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI 6 — Mist Classic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="look.css">
<style>
/* 6 · MIST CLASSIC — форми й компоненти Mist, класичні палітри, світла + темна тема.
   Палітра:  html[data-palette="oxford|ivory|bordeaux"]
   Тема:     html[data-theme="light|dark"]                                         */

/* ---------- Оксфорд: темно-синій + сталевий ---------- */
html[data-palette="oxford"]{
  --bg:#e9edf2; --surface:#fbfcfd; --surface-2:#f0f3f6; --line:#d4dbe4; --text:#1a2332; --muted:#5d697a; --faint:#97a1af;
  --accent:#1c2e4a; --accent-ink:#fff; --accent-soft:#dfe6ee;
  --nav-bg:#cfd9e4; --nav-text:#2b3a51; --nav-strong:#1a2332; --nav-active-bg:#fbfcfd; --nav-active-text:#1a2332; --nav-line:rgba(26,35,50,.12);
  --hero-bg:#1c2e4a; --hero-bar:#cfd9e4;
}
html[data-palette="oxford"][data-theme="dark"]{
  --bg:#0d121a; --surface:#141b26; --surface-2:#1a2330; --line:#243041; --text:#e4e9f0; --muted:#8f9bad; --faint:#5e6a7b;
  --accent:#a9bdd8; --accent-ink:#0d121a; --accent-soft:#1f2b3c;
  --nav-bg:#18212e; --nav-text:#9aa8bb; --nav-strong:#e4e9f0; --nav-active-bg:#223047; --nav-active-text:#fff; --nav-line:#243041;
  --hero-bg:#1f3150; --hero-bar:#a9bdd8;
}
/* ---------- Слонова кістка: графітово-синій на теплому світлому ---------- */
html[data-palette="ivory"]{
  --bg:#eeeae2; --surface:#fcfbf8; --surface-2:#f4f1eb; --line:#ddd6ca; --text:#23262c; --muted:#6a6862; --faint:#a29d93;
  --accent:#2f3e50; --accent-ink:#fff; --accent-soft:#e3e6ea;
  --nav-bg:#d6dadf; --nav-text:#2f3a46; --nav-strong:#23262c; --nav-active-bg:#fcfbf8; --nav-active-text:#23262c; --nav-line:rgba(35,38,44,.12);
  --hero-bg:#2f3e50; --hero-bar:#d6dadf;
}
html[data-palette="ivory"][data-theme="dark"]{
  --bg:#141311; --surface:#1c1b18; --surface-2:#24221e; --line:#33302a; --text:#ebe7df; --muted:#a29c90; --faint:#6b665d;
  --accent:#bcc7d3; --accent-ink:#141311; --accent-soft:#2a2c2f;
  --nav-bg:#222428; --nav-text:#a3abb5; --nav-strong:#ebe7df; --nav-active-bg:#2e3238; --nav-active-text:#fff; --nav-line:#33302a;
  --hero-bg:#2c3644; --hero-bar:#bcc7d3;
}
/* ---------- Бордо: винний + теплий камінь ---------- */
html[data-palette="bordeaux"]{
  --bg:#eee8e5; --surface:#fcfaf9; --surface-2:#f5efed; --line:#e0d5d1; --text:#2a1f22; --muted:#72646a; --faint:#a8999d;
  --accent:#6b1f2e; --accent-ink:#fff; --accent-soft:#f0e1e3;
  --nav-bg:#e2d2d2; --nav-text:#4a2a32; --nav-strong:#2a1f22; --nav-active-bg:#fcfaf9; --nav-active-text:#2a1f22; --nav-line:rgba(42,31,34,.12);
  --hero-bg:#6b1f2e; --hero-bar:#e2d2d2;
}
html[data-palette="bordeaux"][data-theme="dark"]{
  --bg:#151113; --surface:#1d181a; --surface-2:#251f21; --line:#352b2e; --text:#efe6e7; --muted:#a8999c; --faint:#6f6265;
  --accent:#d9a3ad; --accent-ink:#151113; --accent-soft:#33232a;
  --nav-bg:#231b1e; --nav-text:#b19ea3; --nav-strong:#efe6e7; --nav-active-bg:#352429; --nav-active-text:#fff; --nav-line:#352b2e;
  --hero-bg:#4a1d27; --hero-bar:#d9a3ad;
}

/* ---------- спільне для всіх палітр ---------- */
html[data-palette]{
  --font:'Onest',system-ui,sans-serif;
  --radius:20px; --radius-sm:10px; --btn-radius:10px; --card-border:1px solid var(--line);
  --lec:#3e5f8a; --lec-soft:#e2e9f2; --pr:#4a7562; --pr-soft:#e1ece6; --lab:#94703a; --lab-soft:#f1e8da;
  --high:#b5473f; --mid:#b98432; --low:#8f96a0; --ok:#4a7562;
  --hero-text:#fff; --hero-muted:rgba(255,255,255,.64); --hero-track:rgba(255,255,255,.2);
  --track:var(--surface-2); --bar:var(--accent);
  --chip-bg:var(--nav-bg);
  --btn-soft:color-mix(in srgb,var(--accent) 12%,var(--surface));
  --row-active:color-mix(in srgb,var(--accent) 8%,var(--surface));
  --main-bg:color-mix(in srgb,var(--bg) 45%,var(--surface));
  --heat0:var(--surface-2);
  --heat1:color-mix(in srgb,var(--accent) 22%,var(--surface-2));
  --heat2:color-mix(in srgb,var(--accent) 46%,var(--surface-2));
  --heat3:color-mix(in srgb,var(--accent) 72%,var(--surface-2));
  --heat4:var(--accent);
  --title-size:22px; --h2-size:12px; --h-transform:uppercase; --h-spacing:.04em;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --lec:#93add3; --lec-soft:rgba(147,173,211,.13); --pr:#8fbfa6; --pr-soft:rgba(143,191,166,.13); --lab:#d6b27a; --lab-soft:rgba(214,178,122,.13);
  --high:#e07a70; --mid:#d6a85c; --ok:#8fbfa6;
  --hero-text:#f2f4f7; --hero-muted:rgba(242,244,247,.6); --hero-track:rgba(255,255,255,.14);
  --chip-bg:color-mix(in srgb,var(--accent) 22%,var(--surface));
  --btn-soft:color-mix(in srgb,var(--accent) 14%,var(--surface));
  --main-bg:var(--bg);
}

/* ---------- форми Mist ---------- */
body{background:var(--bg);transition:background .2s}
.app{margin:18px;border-radius:28px;overflow:hidden;border:1px solid var(--line);background:var(--main-bg);min-height:calc(100vh - 36px)}
.nav{height:calc(100vh - 36px);top:18px;border-right:0;padding:26px 14px}
.brand-mark{border-radius:50%}
.brand-name{text-transform:uppercase;letter-spacing:.08em;font-size:14px}
.nav-label,.nav-count{color:var(--nav-text);opacity:.72}
.nav-item{border-radius:12px}
.nav-item.is-active{box-shadow:0 1px 0 rgba(0,0,0,.05)}
.nav-user{border-top-color:var(--nav-line)}
.avatar{background:var(--btn-soft);color:var(--accent)}
.page-title{text-transform:uppercase;letter-spacing:.03em;font-weight:600}
.crumbs{text-transform:lowercase}
.btn{border-color:var(--accent);height:34px;font-size:13px;color:var(--text)}
.btn-primary{color:var(--accent-ink)}
.btn-ghost{background:var(--btn-soft);color:var(--accent)}
.btn-sm{height:28px;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.btn-hero{border-color:var(--hero-track);color:var(--hero-text)}
.search{border-radius:12px}
.seg{background:transparent;gap:6px;padding:0}
.seg button{border:1px solid var(--accent);background:transparent;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);padding:4px 10px;border-radius:8px}
.seg button.is-on{background:var(--chip-bg);color:var(--accent);box-shadow:none}
.kpi-label,.hero-label{text-transform:uppercase;font-size:11px;letter-spacing:.06em}
.kpi-value{font-weight:500}
.task{border-top-style:dashed}
.chip{border-color:var(--accent);color:var(--accent);background:transparent}
.chip.is-on{background:var(--chip-bg);color:var(--accent);border-color:var(--accent)}
.md-row.is-active{background:var(--row-active);box-shadow:inset 3px 0 0 var(--accent)}
.md-search{background:var(--surface);border:1px solid var(--line)}
.step.is-cur{background:var(--row-active)}
.step.is-cur .step-n,.step.is-done .step-n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.badge{border-radius:8px}
.tag,.badge-status{background:var(--chip-bg);color:var(--accent)}
.day{border-radius:14px}
.day.is-active{background:var(--chip-bg);border-color:var(--accent);color:var(--accent)}
.now-card{border-radius:24px}
.lesson.is-now .l-title::after{color:var(--accent)}
.avail .c.off{background:repeating-linear-gradient(135deg,var(--line) 0 3px,var(--surface) 3px 7px)}

/* ---------- перемикачі (тема — частина продукту, палітра — лише для вибору) ---------- */
.theme-btn .icon{width:17px;height:17px}
.pal{position:fixed;left:50%;transform:translateX(-50%);bottom:62px;z-index:999;display:flex;gap:2px;padding:4px;border-radius:10px;background:rgba(20,20,22,.92);font:500 12px/1 system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.pal button{all:unset;cursor:pointer;color:#c9c9cf;padding:8px 11px;border-radius:7px;display:inline-flex;align-items:center;gap:6px}
.pal button.on{background:#fff;color:#111}
.pal i{width:10px;height:10px;border-radius:50%;display:inline-block}
.pal .sep{width:1px;background:#333;margin:4px 2px}
.embed .pal{display:none}
@media (max-width:980px){.pal{left:8px;right:8px;transform:none;overflow-x:auto}}
</style>
</head>
<body>
<script src="shell.js"></script>
<script>
(function () {
  const root = document.documentElement;
  const get = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const set = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const q = new URLSearchParams(location.search);
  root.dataset.palette = q.get('p') || get('mc-palette') || 'oxford';
  root.dataset.theme = q.get('t') || get('mc-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

  renderApp({ name: '6 · Mist Classic' });

  const SUN = '<svg class="icon" viewBox="0 0 24 24"><path d="M12 17a5 5 0 100-10 5 5 0 000 10zM12 1.5v2M12 20.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M1.5 12h2M20.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>';
  const MOON = '<svg class="icon" viewBox="0 0 24 24"><path d="M20.5 13.2A8.5 8.5 0 1110.8 3.5a6.6 6.6 0 009.7 9.7z"/></svg>';
  const btn = () => `<button class="icon-btn theme-btn" aria-label="Перемкнути тему"></button>`;
  document.querySelectorAll('.topbar .search').forEach((s) => s.insertAdjacentHTML('afterend', btn()));
  document.querySelector('.pub-head .btn').insertAdjacentHTML('beforebegin', btn());

  const PALS = [['oxford', 'Оксфорд', '#1c2e4a'], ['ivory', 'Слонова кістка', '#2f3e50;outline:2px solid #eeeae2'], ['bordeaux', 'Бордо', '#6b1f2e']];
  document.body.insertAdjacentHTML('beforeend', `<div class="pal">${PALS.map(([k, n, c]) => `<button data-pal="${k}"><i style="background:${c}"></i>${n}</button>`).join('')}<span class="sep"></span><button data-th="light">Світла</button><button data-th="dark">Темна</button></div>`);

  const sync = () => {
    const dark = root.dataset.theme === 'dark';
    document.querySelectorAll('.theme-btn').forEach((b) => { b.innerHTML = dark ? SUN : MOON; b.title = dark ? 'Світла тема' : 'Темна тема'; });
    document.querySelectorAll('[data-pal]').forEach((b) => b.classList.toggle('on', b.dataset.pal === root.dataset.palette));
    document.querySelectorAll('[data-th]').forEach((b) => b.classList.toggle('on', b.dataset.th === root.dataset.theme));
  };
  document.addEventListener('click', (e) => {
    if (e.target.closest('.theme-btn')) { root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'; set('mc-theme', root.dataset.theme); }
    const p = e.target.closest('[data-pal]'); if (p) { root.dataset.palette = p.dataset.pal; set('mc-palette', p.dataset.pal); }
    const t = e.target.closest('[data-th]'); if (t) { root.dataset.theme = t.dataset.th; set('mc-theme', t.dataset.th); }
    sync();
  });
  sync();
})();
</script>
</body>
</html>
