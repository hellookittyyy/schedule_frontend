<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI 13 — Документ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Text:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="look.css">
<link rel="stylesheet" href="graphite.css">
<style>
/* 13 · ДОКУМЕНТ — без бічної панелі: тонке верхнє меню й вузька центрована сторінка.
   Відчуття «читаю документ», а не «сиджу в панелі керування». */
html[data-theme]{
  --font:'Wix Madefor Text',system-ui,sans-serif;
  --radius:14px; --radius-sm:10px; --btn-radius:999px; --pill:999px; --card-border:1px solid var(--line); --pad:24px; --gap:20px;
  --title-size:32px; --title-weight:600; --h2-size:15px;
}
.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
.nav{position:sticky;top:0;height:auto;z-index:5;flex-direction:row;align-items:center;gap:4px;padding:10px 28px;border-right:0;border-bottom:1px solid var(--line);background:var(--bg);overflow-x:auto}
.nav-brand{padding:0 16px 0 0}
.brand-mark{border-radius:50%;width:28px;height:28px;font-size:13px}
.nav-group{flex-direction:row;margin:0;gap:2px;align-items:center}
.nav-group+.nav-group::before{content:'';width:1px;height:18px;background:var(--line);margin:0 8px}
.nav-label,.nav-item .icon{display:none}
.nav-item{padding:7px 13px;border-radius:999px;font-size:13.5px;font-weight:400;color:var(--muted)}
.nav-item:hover{background:var(--surface-2)}
.nav-item.is-active{background:var(--accent);color:var(--accent-ink)}
.nav-item.is-active .nav-count{color:inherit;opacity:.65}
.nav-count{margin-left:6px}
.nav-foot{margin:0 0 0 auto;display:flex;align-items:center}
.nav-foot>.nav-item,.nav-user-name,.nav-user-role{display:none}
.nav-user{border:0;padding:0;margin:0}
.main{max-width:1180px;width:100%;margin:0 auto;padding:40px 32px 90px}
.topbar{margin-bottom:32px}
.search,.icon-btn{border-radius:999px;background:var(--surface)}
.hero-value{font-weight:500}.kpi-value{font-weight:500}
.seg{border-radius:999px;background:var(--surface-2)}
.seg button{border-radius:999px}
.seg button.is-on{box-shadow:none}
.task-group-label{text-transform:none;letter-spacing:0;font-size:13px;font-weight:500}
.sev-ico{border-radius:50%}
.task-fix{background:var(--surface-2);border-radius:14px}
.fix-opt.is-sel{border-color:transparent}
.chip.is-on{background:var(--accent);border-color:var(--accent)}
.md{min-height:560px}
.md-search{border-radius:999px}
.md-row.is-active{background:var(--surface-2);box-shadow:none}
.section-title{text-transform:none;letter-spacing:0;font-size:13px;font-weight:500;color:var(--text)}
.avail .c{border-radius:6px}
.step.is-cur{background:var(--surface-2)}
.pub-search{border-radius:999px}
.now-card{border-radius:22px}
.day{border-radius:999px;padding:10px 0}
.day.is-active{background:var(--accent);border-color:var(--accent)}
.lessons-head{text-transform:none;letter-spacing:0;font-size:13px;color:var(--text);font-weight:500}
</style>
</head>
<body>
<script src="theme.js"></script>
<script src="shell.js"></script>
<script>initTheme('v13-theme'); renderApp({ name: '13 · Документ', calm: true }); mountThemeToggle('v13-theme');</script>
</body>
</html>
