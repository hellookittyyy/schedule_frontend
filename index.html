<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Розклад занять</title>
    <script src="/assets/js/theme-boot.js?v=5f07e596"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/tokens.css?v=9b325578">
    <link rel="stylesheet" href="/assets/css/base.css?v=27556bf0">
    <link rel="stylesheet" href="/assets/css/components.css?v=5bbfd7ff">
    <link rel="stylesheet" href="/assets/css/pages/public.css?v=84c00c21">
</head>

<body>
    <div class="pub-wrap">
        <div class="pub">
            <header class="pub-head">
                <a class="pub-brand" href="/"><span class="pub-brand-mark">Р</span><span class="pub-brand-name">Розклад</span></a>
                <span class="sp"></span>
                <button type="button" class="btn btn-ghost btn-sm" id="shareBtn" hidden></button>
                <button type="button" class="icon-btn sm" id="themeBtn" aria-label="Змінити тему"></button>
            </header>

            <div class="pub-find">
                <div class="combo">
                    <label class="search pub-search" id="searchBox">
                        <span id="searchIco"></span>
                        <input type="text" id="q" placeholder="Група або викладач" autocomplete="off"
                            role="combobox" aria-expanded="false" aria-controls="suggest" aria-autocomplete="list"
                            aria-label="Пошук групи або викладача">
                    </label>
                    <div class="combo-list" id="suggest" role="listbox"></div>
                </div>
                <select class="select pub-course" id="course" aria-label="Курс (для груп)">
                    <option value="">Усі курси</option>
                    <option value="1">1 курс</option>
                    <option value="2">2 курс</option>
                    <option value="3">3 курс</option>
                    <option value="4">4 курс</option>
                    <option value="5">5 курс</option>
                    <option value="6">6 курс</option>
                </select>
            </div>

            <div id="intro" class="card pub-intro"></div>

            <div id="schedule" hidden>
                <div class="pub-sched">
                    <div class="pub-title">
                        <div class="grow">
                            <h1 id="title"></h1>
                            <span class="muted" id="subtitle"></span>
                        </div>
                        <label class="pub-mine">
                            <button type="button" class="switch" id="mineSwitch" role="switch" aria-checked="false"
                                aria-label="Зберегти як мій розклад"></button>
                            Зберегти як мій розклад
                        </label>
                    </div>

                    <div class="card now-card" id="nowCard" hidden></div>
                    <div class="card next-card" id="nextCard" hidden></div>

                    <div class="pub-week">
                        <button type="button" class="icon-btn sm" id="prevWeek" aria-label="Попередній тиждень"></button>
                        <span class="wk-label" id="weekLabel"></span>
                        <button type="button" class="icon-btn sm" id="nextWeek" aria-label="Наступний тиждень"></button>
                        <button type="button" class="btn btn-ghost btn-sm" id="todayBtn">Сьогодні</button>
                        <span class="sp"></span>
                        <input type="date" class="input" id="jumpDate" aria-label="Перейти до дати">
                        <div class="seg" id="viewSeg" role="group" aria-label="Вигляд">
                            <button type="button" data-view="day" class="is-on">День</button>
                            <button type="button" data-view="week">Тиждень</button>
                        </div>
                    </div>

                    <div class="daystrip" id="days"></div>
                    <div class="card lessons" id="lessons"></div>

                    <div class="pub-foot">
                        <button type="button" class="btn btn-ghost" id="icsBtn"></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/assets/js/api.js?v=55e24ce9"></script>
    <script src="/assets/js/ui.js?v=ec4d50f9"></script>
    <script src="/assets/js/icons.js?v=eb6ccbed"></script>
    <script src="/js/public.js?v=24c21e23"></script>
</body>

</html>
